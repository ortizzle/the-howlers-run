<style>
  /* ---------- Design tokens: one system, light and dark. Color is reserved for data (macros) and state. ---------- */
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f1f1ef; --surface-3: #e7e7e4;
    --ink: #15171b; --ink-mid: #4b5058; --ink-dim: #7c8290;
    --line: rgba(21,23,27,.08); --line-strong: rgba(21,23,27,.18);
    --btn-bg: #15171b; --btn-ink: #ffffff;
    --track: #e9e9e6; --grid: #e6e6e3; --axis: #cfcfcb; --bar: #6b7380;
    --protein: #b8302f; --carbs: #a37a00; --fat: #4257d9; --fiber: #2f8a4e;
    --danger: #d0342c; --ok: #1f8a4c; --warn: #b7791f;
    --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --radius: 12px; --radius-lg: 18px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-fuel-scheme="light"]) {
      color-scheme: dark;
      --bg: #0e1013; --surface: #16181d; --surface-2: #1d2026; --surface-3: #262a31;
      --ink: #f2f3f5; --ink-mid: #b1b6bf; --ink-dim: #7d8391;
      --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.18);
      --btn-bg: #f2f3f5; --btn-ink: #0e1013;
      --track: #262a31; --grid: #23272e; --axis: #363b44; --bar: #9aa3b2;
      --protein: #d9455e; --carbs: #bd8b1f; --fat: #7488ff; --fiber: #3aae6c;
      --danger: #ff6b5f; --ok: #4cc98a; --warn: #f0b73a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"], :root[data-fuel-scheme="dark"] {
    color-scheme: dark;
    --bg: #0e1013; --surface: #16181d; --surface-2: #1d2026; --surface-3: #262a31;
    --ink: #f2f3f5; --ink-mid: #b1b6bf; --ink-dim: #7d8391;
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.18);
    --btn-bg: #f2f3f5; --btn-ink: #0e1013;
    --track: #262a31; --grid: #23272e; --axis: #363b44; --bar: #9aa3b2;
    --protein: #d9455e; --carbs: #bd8b1f; --fat: #7488ff; --fiber: #3aae6c;
    --danger: #ff6b5f; --ok: #4cc98a; --warn: #f0b73a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-fuel-scheme="light"] {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f1f1ef; --surface-3: #e7e7e4;
    --ink: #15171b; --ink-mid: #4b5058; --ink-dim: #7c8290;
    --line: rgba(21,23,27,.08); --line-strong: rgba(21,23,27,.18);
    --btn-bg: #15171b; --btn-ink: #ffffff;
    --track: #e9e9e6; --grid: #e6e6e3; --axis: #cfcfcb; --bar: #6b7380;
    --protein: #b8302f; --carbs: #a37a00; --fat: #4257d9; --fiber: #2f8a4e;
    --danger: #d0342c; --ok: #1f8a4c; --warn: #b7791f;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; min-height: 100vh; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 12px; min-height: 44px; width: 100%; }
  textarea { min-height: 96px; resize: vertical; }
  a { color: var(--ink); }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- Shell ---------- */
  .app { max-width: 560px; margin: 0 auto; padding: 0 16px; padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
  header.top { position: sticky; top: 0; z-index: 20; margin: 0 -16px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-weight: 800; font-size: 22px; letter-spacing: -.01em; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { min-height: 44px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-mid); white-space: nowrap; }
  .seg button.active { background: var(--btn-bg); color: var(--btn-ink); }
  .seg.wide { width: 100%; } .seg.wide button { flex: 1; padding: 0 8px; }
  .icon-btn { min-width: 44px; min-height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-mid); }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; }
  .preview-banner { margin: 10px 0 0; padding: 8px 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px dashed var(--line-strong); font-size: 13px; color: var(--ink-mid); }

  .datebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 10px; }
  .date-label { flex: 1; min-height: 44px; display: flex; align-items: baseline; justify-content: center; gap: 8px; font-weight: 700; font-size: 18px; border-radius: var(--radius); }
  .date-label small { font-weight: 500; font-size: 13px; color: var(--ink-dim); }

  /* ---------- Cards & summary ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 16px; }
  .card + .card { margin-top: 12px; }
  .card h3 { font-size: 15px; font-weight: 700; }
  .card .sub { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }
  .summary { display: grid; grid-template-columns: 124px 1fr; gap: 16px; align-items: center; }
  @media (max-width: 340px) { .summary { grid-template-columns: 1fr; justify-items: center; } }
  .ring-wrap { position: relative; width: 124px; height: 124px; }
  .ring-wrap svg { width: 124px; height: 124px; display: block; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1; }
  .ring-center .big { font-size: 27px; font-weight: 800; letter-spacing: -.02em; }
  .ring-center .small { font-size: 11px; color: var(--ink-dim); margin-top: 5px; }
  .ring-center .rem { font-size: 12px; font-weight: 600; color: var(--ink-mid); margin-top: 5px; }
  .macros { display: flex; flex-direction: column; gap: 9px; width: 100%; }
  .macro { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 8px; row-gap: 4px; align-items: baseline; font-size: 13px; }
  .macro .lbl { grid-column: 1; grid-row: 1; font-weight: 600; color: var(--ink-mid); display: inline-flex; align-items: center; gap: 6px; }
  .macro .lbl i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--mc); }
  .macro .val { grid-column: 2; grid-row: 1; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .macro .val small { color: var(--ink-dim); font-weight: 500; font-size: 11px; }
  .macro .bar { grid-column: 1 / 3; grid-row: 2; height: 6px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .macro .bar > div { height: 100%; border-radius: 4px; background: var(--mc); width: 0; transition: width .4s ease; }
  .macro .bar > div.over { background: var(--danger); }
  .macro.protein { --mc: var(--protein); } .macro.carbs { --mc: var(--carbs); } .macro.fat { --mc: var(--fat); } .macro.fiber { --mc: var(--fiber); }
  .link-btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--ink-mid); padding: 0 4px; }
  .link-btn svg { width: 18px; height: 18px; }

  /* ---------- Log ---------- */
  .meal { margin-top: 16px; }
  .meal-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 6px; }
  .meal-title { font-weight: 700; font-size: 15px; }
  .meal-kcal { font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .entry { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; min-height: 60px; padding: 10px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); margin-bottom: 6px; }
  .entry:active { background: var(--surface-2); }
  .entry .name { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .entry .name .brand { font-weight: 500; color: var(--ink-dim); }
  .entry .meta { font-size: 12.5px; color: var(--ink-dim); margin-top: 3px; }
  .entry .kcal { font-weight: 700; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
  .mac { display: flex; gap: 6px; justify-content: flex-end; margin-top: 3px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mac .p { color: var(--protein); } .mac .c { color: var(--carbs); } .mac .f { color: var(--fat); } .mac .fb { color: var(--fiber); }
  .mac .sep { color: var(--line-strong); font-weight: 400; }
  .empty { text-align: center; padding: 36px 12px; color: var(--ink-dim); }
  .empty h3 { font-size: 18px; font-weight: 700; color: var(--ink-mid); margin-bottom: 6px; }
  .empty p { font-size: 14px; max-width: 320px; margin: 0 auto; }

  /* ---------- Capture bar ---------- */
  .capture-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .capture-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .cap-btn { min-height: 58px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 600; font-size: 13px; }
  .cap-btn svg { width: 22px; height: 22px; }
  .cap-btn:active { transform: translateY(1px); }
  .cap-btn.primary { background: var(--btn-bg); color: var(--btn-ink); border-color: transparent; }

  /* ---------- Buttons & forms ---------- */
  .btn { min-height: 46px; padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--btn-bg); color: var(--btn-ink); border-color: transparent; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.ghost { background: transparent; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn-row .btn { flex: 1; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-dim); margin-bottom: 5px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .note { font-size: 13px; color: var(--ink-dim); margin: 8px 0; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; background: var(--surface-2); }
  .stepper button { width: 44px; height: 44px; font-size: 22px; color: var(--ink); }
  .stepper .sv { min-width: 56px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .status { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius); background: var(--surface-2); font-size: 14px; color: var(--ink-mid); margin: 10px 0; }
  .status.err { color: var(--danger); border: 1px solid var(--danger); background: transparent; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ink); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Sheets & modal ---------- */
  .sheet-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 600px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); }
  .sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 2px auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .sheet-head h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .sheet-head .sub { font-size: 13px; color: var(--ink-dim); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  .modal-box { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px; padding: 22px; max-width: 90vw; width: 340px; box-shadow: var(--shadow); }
  .modal-box h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  .modal-box p { color: var(--ink-mid); font-size: 15px; }
  .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
  .modal-buttons button { flex: 1; min-height: 44px; border-radius: 10px; font-size: 16px; font-weight: 600; }
  .btn-primary { background: var(--btn-bg); color: var(--btn-ink); }
  .btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-strong); }
  .toast { position: fixed; left: 50%; bottom: calc(106px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 300; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: all .25s ease; pointer-events: none; max-width: 90vw; text-align: center; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Product card, results, lists, scanner ---------- */
  .product { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: var(--radius); background: var(--surface-2); margin-bottom: 12px; }
  .product img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; background: var(--surface-3); }
  .product .ph { width: 56px; height: 56px; border-radius: 10px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; color: var(--ink-dim); }
  .product .ph svg { width: 24px; height: 24px; }
  .product .pname { font-weight: 700; line-height: 1.2; }
  .product .pbrand { color: var(--ink-dim); font-size: 13px; }
  .product .pserv { font-size: 13px; color: var(--ink-mid); margin-top: 4px; }
  .product .mac { justify-content: flex-start; margin-top: 6px; font-size: 13px; }
  .result-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .result-item input[type=checkbox] { width: 22px; height: 22px; min-height: 0; accent-color: var(--ink); }
  .result-item .rname { font-weight: 600; line-height: 1.2; }
  .result-item .rportion { font-size: 13px; color: var(--ink-dim); }
  .result-item .rk { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .conf { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 6px; margin-left: 6px; border: 1px solid var(--line-strong); color: var(--ink-dim); vertical-align: middle; }
  .conf.high { color: var(--ok); border-color: var(--ok); } .conf.low { color: var(--warn); border-color: var(--warn); }
  .result-item .rstep { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-dim); }
  .quick-list { max-height: 44vh; overflow-y: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--radius); }
  .quick-item { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 52px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .quick-item:active { background: var(--surface-2); }
  .quick-item .qn { font-weight: 600; font-size: 15px; }
  .quick-item .qs { font-size: 12px; color: var(--ink-dim); }
  .quick-item .qk { white-space: nowrap; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
  .preview-img { width: 100%; max-height: 240px; object-fit: contain; border-radius: var(--radius); background: var(--surface-3); display: block; margin-bottom: 10px; }
  .scan-box { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; background: #000; border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; }
  .scan-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-box .reticle { position: absolute; left: 12%; right: 12%; top: 34%; bottom: 34%; border: 2px solid #fff; border-radius: 8px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; }
  .scan-box .reticle::after { content: ''; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; background: #fff; opacity: .8; animation: scanline 1.6s ease-in-out infinite alternate; }
  @keyframes scanline { from { transform: translateY(-28px); } to { transform: translateY(28px); } }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }

  /* ---------- Insights ---------- */
  .filters { margin: 12px 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stat { padding: 10px 12px; border-radius: var(--radius); background: var(--surface-2); }
  .stat .v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .stat .l { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }
  .chart { position: relative; margin-top: 12px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--font); font-size: 11px; fill: var(--ink-dim); }
  .chart .hit { fill: transparent; cursor: pointer; }
  .tip { position: absolute; z-index: 5; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; pointer-events: none; white-space: nowrap; transform: translate(-50%, -100%); box-shadow: var(--shadow); }
  .split { display: flex; height: 10px; gap: 2px; border-radius: 6px; overflow: hidden; margin-top: 10px; }
  .split > div { height: 100%; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--ink-mid); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }

<script>
(function () {
'use strict';

/* =====================================================================
   1. Canonical helpers (family-app-standards › core-patterns)
   ===================================================================== */
const AZ = {
  tz: 'America/Phoenix',
  today() { return new Intl.DateTimeFormat('en-CA', { timeZone: this.tz }).format(new Date()); },
  dateKey(d) { return new Intl.DateTimeFormat('en-CA', { timeZone: this.tz }).format(d); },
  pretty(dateStr) {
    const [y, m, day] = dateStr.split('-').map(Number);

  daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); },
  addDays(dateStr, n) {

  timeHM() { return new Intl.DateTimeFormat('en-GB', { timeZone: this.tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()); }

const Store = {
  ns: 'fuel_',
  get(key, fallback = null) {

    catch (e) { return fallback; }

  set(key, value) {

    catch (e) { return false; }

function showModal({ title, message, confirmText = 'OK', cancelText = null, onConfirm = null, danger = false }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const h = document.createElement('h3'); h.textContent = title;
  const p = document.createElement('p'); p.textContent = message;
  const btnRow = document.createElement('div'); btnRow.className = 'modal-buttons';

    const cancel = document.createElement('button'); cancel.type = 'button';
    cancel.textContent = cancelText; cancel.className = 'btn-secondary';
    cancel.addEventListener('click', () => overlay.remove());

  const ok = document.createElement('button'); ok.type = 'button';
  ok.textContent = confirmText; ok.className = danger ? 'btn-secondary' : 'btn-primary';
  if (danger) ok.style.color = 'var(--danger)';
  ok.addEventListener('click', () => { overlay.remove(); if (onConfirm) onConfirm(); });
  btnRow.appendChild(ok);
  box.append(h, p, btnRow);
  overlay.appendChild(box);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

let toastTimer = null;
function toast(msg, ms) {

  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || Math.min(9000, 2500 + msg.length * 40));

/* =====================================================================
   2. DOM helpers — createElement only, never innerHTML with data
   ===================================================================== */
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {

function svgEl(tag, attrs) { const n = document.createElementNS(SVG_NS, tag); for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); return n; }

}
const ICON = { close: 'M6 6l12 12M18 6L6 18', spark: 'M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z', plate: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0' };
function fmtK(n) { return Math.round(Number(n) || 0).toLocaleString('en-US'); }
function fmtG(n) { const r = Math.round((Number(n) || 0) * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }

  if (withFiber && per.fiber) parts.push(sep(), el('span', { class: 'fb', text: 'Fiber ' + fmtG(per.fiber * m) }));
  return el('div', { class: 'mac' }, parts);
}
function stepper({ value, step = 0.5, min = 0.25, max = 50, onChange, format }) {
  let v = value;
  const fmt = format || fmtServ;
  const display = el('span', { class: 'sv', text: fmt(v) });
  const set = (nv) => { v = Math.min(max, Math.max(min, Math.round(nv * 100) / 100)); display.textContent = fmt(v); onChange(v); };
  const wrap = el('div', { class: 'stepper' },
    el('button', { type: 'button', 'aria-label': 'Less', text: '−', onclick: () => set(v - step) }),
    display,
    el('button', { type: 'button', 'aria-label': 'More', text: '+', onclick: () => set(v + step) }));
  wrap.setValue = set;
  return wrap;
}
function numInput(attrs) { return el('input', Object.assign({ type: 'text', inputmode: 'decimal', autocomplete: 'off' }, attrs)); }
function numVal(input, fallback) { const n = parseFloat(String(input.value).replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? n : (fallback || 0); }
function titleCase(s) {
  s = String(s || '');
  if (s !== s.toUpperCase()) return s;
  return s.toLowerCase().replace(/(^|\s|[-("])([a-z])/g, (m, a, b) => a + b.toUpperCase());
}
function segControl(options, value, onChange, extraClass) {
  const seg = el('div', { class: 'seg wide' + (extraClass ? ' ' + extraClass : ''), role: 'tablist' });
  const draw = (cur) => { clear(seg); for (const [v, label] of options) seg.appendChild(el('button', { type: 'button', role: 'tab', class: v === cur ? 'active' : '', 'aria-selected': v === cur ? 'true' : 'false', text: label, onclick: () => { draw(v); onChange(v); } })); };
  draw(value);
  return seg;
}

/* =====================================================================
   3. State & data model (records with id/updatedAt/tombstones — Gist-sync ready)
   ===================================================================== */
const DEFAULT_TARGETS = { kcal: 2200, protein: 160, carbs: 230, fat: 75, fiber: 30 };
const MEALS = [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner'], ['snack', 'Snack'], ['preworkout', 'Pre-workout'], ['postworkout', 'Post-workout']];
const CONTEXTS = [['home', 'Home-cooked'], ['takeout', 'Takeout'], ['restaurant', 'Restaurant'], ['work', 'At work'], ['onthego', 'On the go'], ['packaged', 'Packaged'], ['social', 'Social / event'], ['other', 'Other']];
const SOURCE_LABEL = { upc: 'Scanned', photo: 'Photo estimate', manual: 'Manual', ai: 'Described', quick: 'Quick add', usda: 'USDA' };
const MODELS = [['claude-sonnet-5', 'Sonnet 5 · default'], ['claude-opus-5', 'Opus 5 · most capable'], ['claude-haiku-4-5', 'Haiku 4.5 · cheapest']];

const state = {
  date: AZ.today(),
  view: 'log',
  insightsRange: 7,
  data: Store.get('data', { records: {} }),
  settings: Object.assign({ targets: Object.assign({}, DEFAULT_TARGETS), scheme: 'system', model: 'claude-sonnet-5' }, Store.get('settings', {}) || {}),
  preview: !!window.FUEL_PREVIEW
};
if (!state.data || typeof state.data !== 'object') state.data = { records: {} };
if (!state.data.records) state.data.records = {};
state.settings.targets = Object.assign({}, DEFAULT_TARGETS, state.settings.targets || {});

function saveData() { if (!Store.set('data', state.data)) toast('Storage is full — could not save'); }
function saveSettings() { Store.set('settings', state.settings); }
function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function mealIndex(m) { const i = MEALS.findIndex(x => x[0] === m); return i < 0 ? 99 : i; }
function mealLabel(m) { const f = MEALS.find(x => x[0] === m); return f ? f[1] : cap(m); }
function contextLabel(c) { const f = CONTEXTS.find(x => x[0] === c); return f ? f[1] : 'Other'; }
function guessMeal() { const h = AZ.hour(); if (h < 10) return 'breakfast'; if (h < 14) return 'lunch'; if (h < 17) return 'snack'; if (h < 21) return 'dinner'; return 'snack'; }
function lastContext() { const c = Store.get('last_context', 'home'); return CONTEXTS.some(x => x[0] === c) ? c : 'home'; }
function currentModel() { const m = state.settings.model; return MODELS.some(x => x[0] === m) ? m : 'claude-sonnet-5'; }
function cleanPer(per) {
  per = per || {};
  return { kcal: Math.max(0, Math.round(Number(per.kcal) || 0)), protein: Math.max(0, round1(per.protein)), carbs: Math.max(0, round1(per.carbs)), fat: Math.max(0, round1(per.fat)), fiber: Math.max(0, round1(per.fiber)) };
}
function scalePer(per, mult) { const o = {}; for (const k of ['kcal', 'protein', 'carbs', 'fat', 'fiber']) o[k] = (Number(per[k]) || 0) * mult; return o; }

function addEntry(e) {
  const id = uid(); const now = Date.now();
  const context = CONTEXTS.some(c => c[0] === e.context) ? e.context : lastContext();
  state.data.records[id] = {
    id, type: 'entry',
    date: e.date || state.date,
    meal: MEALS.some(m => m[0] === e.meal) ? e.meal : guessMeal(),
    context,
    time: e.time || AZ.timeHM(),
    name: String(e.name || 'Untitled').slice(0, 120),
    brand: e.brand ? String(e.brand).slice(0, 80) : '',
    source: e.source || 'manual',
    barcode: e.barcode || null,
    servings: Math.max(0.05, Number(e.servings) || 1),
    serving: { label: (e.serving && e.serving.label) || '1 serving', grams: (e.serving && Number(e.serving.grams)) || null },
    per: cleanPer(e.per),
    note: e.note ? String(e.note).slice(0, 300) : '',
    createdAt: now, updatedAt: now
  };
  Store.set('last_context', context);
  saveData();
  return id;
}
function updateEntry(id, patch) { const r = state.data.records[id]; if (!r) return; Object.assign(r, patch, { updatedAt: Date.now() }); saveData(); }
function deleteEntry(id) { const r = state.data.records[id]; if (!r) return; state.data.records[id] = Object.assign({}, r, { deleted: true, updatedAt: Date.now() }); saveData(); }
function entriesFor(date) {
  return Object.values(state.data.records)
    .filter(r => r && r.type === 'entry' && !r.deleted && r.date === date)
    .sort((a, b) => (mealIndex(a.meal) - mealIndex(b.meal)) || ((a.createdAt || 0) - (b.createdAt || 0)));
}
function entryTotals(e) { return scalePer(e.per, e.servings || 1); }
function dayTotals(entries) {
  const t = { kcal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
  for (const e of entries) { const x = entryTotals(e); for (const k in t) t[k] += x[k]; }
  return t;
}

/* =====================================================================
   4. Rendering — log view
   ===================================================================== */
function render() { renderHeader(); renderSummary(); renderDayAI(); renderLog(); if (state.view === 'insights') renderInsights(); }

function renderHeader() {
  const lbl = $('date-label'); clear(lbl);
  const today = AZ.today();
  if (state.date === today) { lbl.append('Today', el('small', { text: AZ.pretty(today) })); }
  else {
    const diff = AZ.daysBetween(today, state.date);
    lbl.append(AZ.pretty(state.date), el('small', { text: diff === -1 ? 'yesterday' : diff === 1 ? 'tomorrow' : (diff < 0 ? (-diff) + 'd ago' : 'in ' + diff + 'd') }));
  }
}

function ringSVG(pct) {

  const svg = svgEl('svg', { viewBox: '0 0 ' + size + ' ' + size, 'aria-hidden': 'true' });
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, cx = size / 2;
  svg.appendChild(svgEl('circle', { cx, cy: cx, r, fill: 'none', stroke: 'var(--track)', 'stroke-width': stroke }));
  const fill = Math.min(1, Math.max(0, pct));
  if (fill > 0) svg.appendChild(svgEl('circle', { cx, cy: cx, r, fill: 'none', stroke: pct > 1.05 ? 'var(--danger)' : 'var(--ink)', 'stroke-width': stroke, 'stroke-dasharray': (fill * c) + ' ' + c, 'stroke-linecap': 'round', transform: 'rotate(-90 ' + cx + ' ' + cx + ')' }));

  const p = target > 0 ? val / target : 0;
  const fillEl = el('div', { class: p > 1.05 ? 'over' : '' });
  fillEl.style.width = Math.min(100, p * 100).toFixed(1) + '%';
  return el('div', { class: 'macro ' + key },
    el('span', { class: 'lbl' }, el('i'), label),
    el('div', { class: 'bar' }, fillEl),
    el('span', { class: 'val' }, fmtG(val), el('small', { text: ' / ' + fmtG(target) + ' g' })));
}
function renderSummary() {
  const box = $('summary'); clear(box);
  const entries = entriesFor(state.date);
  const t = dayTotals(entries); const T = state.settings.targets;
  const pct = T.kcal > 0 ? t.kcal / T.kcal : 0;
  const remaining = Math.round(T.kcal - t.kcal);
  const center = el('div', { class: 'ring-center' },
    el('div', { class: 'big', text: fmtK(t.kcal) }),
    el('div', { class: 'small', text: 'of ' + fmtK(T.kcal) + ' kcal' }),
    el('div', { class: 'rem', text: remaining >= 0 ? fmtK(remaining) + ' left' : fmtK(-remaining) + ' over', style: remaining < 0 ? 'color:var(--danger)' : '' }));
  const ring = el('div', { class: 'ring-wrap' }, ringSVG(pct), center);
  const macros = el('div', { class: 'macros' });
  for (const [key, label] of [['protein', 'Protein'], ['carbs', 'Carbs'], ['fat', 'Fat'], ['fiber', 'Fiber']]) macros.appendChild(macroRow(key, label, t[key], Number(T[key]) || 0));

function renderDayAI() {
  const box = $('day-ai'); clear(box);
  if (!entriesFor(state.date).length) return;
  const out = el('div');
  const btn = el('button', { class: 'link-btn', type: 'button' }, svgIcon(ICON.spark, 18), 'Summarize ' + (state.date === AZ.today() ? 'today' : 'this day') + ' with Claude');
  btn.addEventListener('click', () => summarizeDay(state.date, out, btn));

function renderLog() {
  const log = $('log'); clear(log);
  const entries = entriesFor(state.date);
  if (!entries.length) {
    log.appendChild(el('div', { class: 'empty' },
      el('h3', { text: state.date === AZ.today() ? 'Nothing logged yet' : 'No entries this day' }),
      el('p', { text: 'Scan a barcode, snap a photo of your plate or a nutrition label, or add something by hand.' })));
    return;
  }
  for (const [mealKey, mealName] of MEALS) {
    const group = entries.filter(e => e.meal === mealKey);
    if (!group.length) continue;
    const kcal = group.reduce((s, e) => s + entryTotals(e).kcal, 0);
    const section = el('section', { class: 'meal' },
      el('div', { class: 'meal-head' }, el('span', { class: 'meal-title', text: mealName }), el('span', { class: 'meal-kcal', text: fmtK(kcal) + ' kcal' })));

      section.appendChild(el('button', { class: 'entry', type: 'button', 'aria-label': 'Edit ' + e.name, onclick: () => openEditSheet(e.id) },
        el('div', {},
          el('div', { class: 'name' }, e.name, e.brand ? el('span', { class: 'brand', text: ' · ' + e.brand }) : null),
          el('div', { class: 'meta', text: meta })),
        el('div', {}, el('div', { class: 'kcal', text: fmtK(tot.kcal) }), macroText(e.per, e.servings))));
    }
    log.appendChild(section);
  }
}

/* =====================================================================
   5. Sheets (bottom panels) and shared cards
   ===================================================================== */
let currentSheet = null;
function openSheet({ title, sub }) {
  closeSheet();
  const overlay = el('div', { class: 'sheet-overlay' });
  const body = el('div', { class: 'sheet-body' });
  const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-label': title },

   8. Barcode scanner — native BarcodeDetector (Chrome / Android) first, ZXing (lazy-loaded) elsewhere
   ===================================================================== */
const ZXING_URLS = ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js', 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'];
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => resolve(); s.onerror = () => { s.remove(); reject(new Error('Could not load ' + src)); };
    document.head.appendChild(s);
  });
}
const Scanner = {
  FORMATS: ['ean_13', 'ean_8', 'upc_a', 'upc_e'],
  stream: null, timer: null, reader: null, active: false, engine: null,
  async loadZXing() {
    if (window.ZXing) return true;
    if (!this._loading) this._loading = (async () => { for (const u of ZXING_URLS) { try { await loadScript(u); if (window.ZXing) return true; } catch (e) {} } return false; })();
    const ok = await this._loading; if (!ok) this._loading = null; return ok;
  },
  zxingHints() {
    const Z = window.ZXing; const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    return hints;
  },
  async hasNative() {
    try { if (!('BarcodeDetector' in window)) return false; const f = await window.BarcodeDetector.getSupportedFormats(); return f.includes('ean_13'); } catch (e) { return false; }
  },
  async start(video, onCode, onStatus) {
    this.stop();

    const constraints = { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } };
    if (await this.hasNative()) {
      this.engine = 'native';
      const det = new window.BarcodeDetector({ formats: this.FORMATS });
      this.stream = await navigator.mediaDevices.getUserMedia(constraints);

        const track = this.stream.getVideoTracks()[0]; const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      } catch (e) {}
      video.srcObject = this.stream;
      await video.play().catch(() => {});
      this.active = true;
      const tick = async () => {
        if (!this.active) return;
        try {
          if (video.readyState >= 2) {
            const codes = await det.detect(video);
            if (codes && codes.length) { const c = codes[0]; this.stop(); onCode(c.rawValue, String(c.format || '')); return; }
          }
        } catch (e) {}
        this.timer = setTimeout(tick, 120);
      };
      onStatus('native'); tick();
      return;
    }
    onStatus('loading');
    if (!(await this.loadZXing())) throw new Error('NO_ZXING');
    const Z = window.ZXing;
    this.engine = 'zxing';
    this.reader = new Z.BrowserMultiFormatReader(this.zxingHints(), 250);
    this.active = true;
    await this.reader.decodeFromConstraints(constraints, video, (result, err) => {
      if (!this.active) return;
      if (result) {
        const text = result.getText(); const fmt = String(Z.BarcodeFormat[result.getBarcodeFormat()] || '').toLowerCase();
        this.stop(); onCode(text, fmt);
      } else if (err && !(err instanceof Z.NotFoundException) && !(err instanceof Z.ChecksumException) && !(err instanceof Z.FormatException)) {
        onStatus('error', err);
      }
    });
    onStatus('zxing');
  },
  stop() {
    this.active = false;
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.reader) { try { this.reader.reset(); } catch (e) {} this.reader = null; }
    if (this.stream) { try { this.stream.getTracks().forEach(t => t.stop()); } catch (e) {} this.stream = null; }
  },
  async decodeImageFile(file) {
    if (!(await this.loadZXing())) throw new Error('NO_ZXING');
    const Z = window.ZXing;
    const reader = new Z.BrowserMultiFormatReader(this.zxingHints());
    const url = URL.createObjectURL(file);
    try {
      const r = await reader.decodeFromImageUrl(url);
      return { text: r.getText(), format: String(Z.BarcodeFormat[r.getBarcodeFormat()] || '').toLowerCase() };
    } catch (e) {
      if (e instanceof Z.NotFoundException || /NotFound|ChecksumException|FormatException/.test(String(e && (e.name + ' ' + e.message)))) return null;
      throw e;
    } finally { URL.revokeObjectURL(url); try { reader.reset(); } catch (e) {} }

};
function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      const ctx = beep.ctx || (beep.ctx = new AC());
      const o = ctx.createOscillator(), g = ctx.createGain();

}
function cameraErrorMessage(e) {
  const name = e && e.name; const msg = String((e && e.message) || e);
  if (msg === 'NO_CAMERA_API') return 'This browser cannot open the camera here' + (state.preview ? ' (preview build)' : '') + '. Type the barcode below or use a photo of it.';
  if (msg === 'NO_ZXING') return 'The barcode decoder could not be downloaded (offline?). Type the barcode below.';
  if (name === 'NotAllowedError' || name === 'SecurityError') return 'Camera permission was denied. Allow camera access for this site, or type the barcode below.';
  if (name === 'NotFoundError' || name === 'OverconstrainedError') return 'No usable camera was found. Type the barcode below.';

function openScanSheet() {
  const s = openSheet({ title: 'Scan barcode', sub: 'Aim at the UPC / EAN on the package' });
  const video = el('video', { playsinline: true, muted: true, autoplay: true });
  video.muted = true; video.setAttribute('playsinline', 'true');
  const box = el('div', { class: 'scan-box' }, video, el('div', { class: 'reticle' }));
  const status = el('div', { class: 'status' });
  const codeIn = el('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: 'Barcode digits', 'aria-label': 'Barcode digits' });
  const lookupBtn = el('button', { class: 'btn', type: 'button', text: 'Look up', style: 'width:auto;flex:none' });
  const fileIn = el('input', { type: 'file', accept: 'image/*', class: 'hidden', 'aria-label': 'Photo of a barcode' });
  const photoBtn = el('button', { class: 'btn ghost', type: 'button', text: 'Use a photo of the barcode', style: 'margin-top:8px', onclick: () => fileIn.click() });
  const result = el('div', { style: 'margin-top:12px' });
  s.body.append(box, status,
    el('div', { class: 'field', style: 'margin-top:12px' }, el('label', { text: 'Or type the barcode' }), el('div', { style: 'display:flex;gap:8px' }, codeIn, lookupBtn)),
    photoBtn, fileIn, result);
  s.onClose = () => Scanner.stop();

  const lookup = async (code) => {
    code = String(code || '').replace(/\D/g, '');
    if (code.length < 8) { statusLine(status, 'Enter at least 8 digits.', 'err'); return; }
    statusLine(status, 'Looking up ' + code + '…', 'busy');
    clear(result);
    try {
      const r = await FoodDB.lookupBarcode(code, (m) => statusLine(status, m, 'busy'));
      if (r.product) {
        statusLine(status, (r.from === 'local' ? 'Remembered from an earlier scan' : r.from === 'usda' ? 'Found in USDA FoodData Central' : 'Found in Open Food Facts') + ' · ' + code);
        renderProductCard(result, r.product, { source: 'upc', barcode: code, onAdded: () => closeSheet() });
      } else notFound(code, r);
    } catch (e) {
      const m = String((e && e.message) || e);
      statusLine(status, 'Lookup failed: ' + (/Failed to fetch|NetworkError|Load failed/i.test(m) ? 'no connection' + (state.preview ? ' (network is blocked in the preview build)' : '') : m), 'err');
      notFoundButtons(code, result, true);
    }
  };
  const notFound = (code, r) => {
    statusLine(status, r.from === 'off-nodata' ? 'Open Food Facts knows this product but has no nutrition data for it.' : 'Not in Open Food Facts (' + code + ').', 'err');
    notFoundButtons(code, result, false);
  };
  const notFoundButtons = (code, container, isError) => {
    clear(container);
    container.append(
      el('div', { class: 'note', text: isError ? 'You can still log it:' : 'No match — but the label on the package has everything we need:' }),
      el('button', { class: 'btn primary', type: 'button', text: 'Photograph the Nutrition Facts label', onclick: () => openPhotoSheet({ barcode: code }) }),
      el('div', { style: 'height:8px' }),
      el('button', { class: 'btn', type: 'button', text: 'Enter it by hand', onclick: () => openAddSheet({ tab: 'custom', prefill: { barcode: code } }) }),
      el('div', { style: 'height:8px' }),
      el('button', { class: 'btn ghost', type: 'button', text: 'Scan again', onclick: () => { clear(container); startCam(); } }));
  };
  const onCode = (text, format) => {
    const code = normalizeBarcode(text, format);

  };
  const startCam = () => {
    box.classList.remove('hidden');
    statusLine(status, 'Starting camera…', 'busy');
    Scanner.start(video, onCode, (st, err) => {
      if (st === 'loading') statusLine(status, 'Loading barcode decoder…', 'busy');

      else if (st === 'error') statusLine(status, 'Scanner error: ' + String((err && err.message) || err).slice(0, 100), 'err');

}

function openPhotoSheet({ barcode } = {}) {
  const s = openSheet({ title: 'Photo', sub: barcode ? 'Photograph the Nutrition Facts label for ' + barcode : 'Snap the plate, or a Nutrition Facts label' });

    await AI.ready;
    clear(gate);
    if (!AI.mode()) {
      gate.append(el('div', { class: 'status err' }, el('span', { text: 'Photo analysis uses Claude. Add your API key in Settings to enable it (the app works fully without it).' })),

    }

}

/* =====================================================================
   10. Insights — trends over 7 / 14 / 30 days, plus Claude's read of the numbers

const HOUR_BUCKETS = [['5–8', 'Early'], ['8–11', 'Morning'], ['11–14', 'Midday'], ['14–17', 'Afternoon'], ['17–20', 'Evening'], ['20–23', 'Night'], ['23–5', 'Late']];

function computeStats(days) {

  const kcalHit = logged.filter(x => Math.abs(x.totals.kcal - T.kcal) <= T.kcal * 0.1).length;

function niceStep(max) {

function columnChart(container, { items, target, tipText, unit = '', height = 170, labelMax = false }) {
