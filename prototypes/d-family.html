<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121628">
<title>Howlers Family Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Baloo+2:wght@500;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121628; --panel: #1b2140; --panel2: #252c52; --ink: #f3ecdc; --ink2: #ffe3b0; --muted: #a2a3bf;
  --line: rgba(242,169,59,.2); --accent: #f2a93b; --accent-soft: rgba(242,169,59,.16); --on-accent: #1a1405;
  --pup: #ff8a5b; --teal: #4fc3b5; --fh: 'Cinzel', Georgia, serif; --fb: 'Spectral', Georgia, serif; --fp: 'Baloo 2', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 16px; line-height: 1.5; min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.proto-bar { font-family: var(--fb); font-size: 12px; text-align: center; padding: 6px 16px; background: var(--line); color: var(--muted); }
.proto-bar a { color: inherit; }

/* member switcher */
.members { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; scrollbar-width: none; }
.members::-webkit-scrollbar { display: none; }
.mchip { flex: 0 0 auto; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
.mchip .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
.mchip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

/* FAB */
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 40;
  min-height: 56px; padding: 0 28px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  font-family: var(--fh); font-size: 17px; letter-spacing: .06em; box-shadow: 0 8px 28px rgba(0,0,0,.35); display: flex; align-items: center; gap: 10px; }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.modal { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--panel); color: var(--ink);
  border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4 } }
@keyframes fade { from { opacity: 0 } }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.modal-title { font-family: var(--fh); font-size: 19px; }
.modal-x { width: 44px; height: 44px; font-size: 28px; color: var(--muted); }
.fld { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
.fld small { text-transform: none; letter-spacing: 0; opacity: .8; }
.min-val { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 14px; margin-left: 6px; }
.act-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act-group { grid-column: 1 / -1; font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }
.act-btn { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 14px; }
.act-btn.on, .int-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.act-ico { font-size: 18px; }
.min-range { width: 100%; height: 44px; accent-color: var(--accent); }
.int-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.int-btn { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; }
.int-btn small { font-size: 11px; color: var(--muted); }
.lbs-input { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 0 14px; font-size: 17px; }
.log-preview { margin: 18px 0 12px; text-align: center; font-size: 15px; color: var(--muted); }
.log-preview b { font-family: var(--fh); font-size: 34px; color: var(--accent); margin-right: 4px; }
.log-preview-sub { font-size: 12px; }
.btn-primary { width: 100%; min-height: 54px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-family: var(--fh); font-size: 18px; letter-spacing: .06em; }

/* toast */
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -140%); z-index: 200; background: var(--ink); color: var(--bg);
  padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); transition: transform .25s; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
.toast.show { transform: translate(-50%, 0); }

/* shared bits */
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.habit { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 4px; text-align: left; font-size: 15px; }
.habit .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; flex: 0 0 auto; }
.habit.on .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.habit .pts { margin-left: auto; font-size: 12px; color: var(--muted); }
.ledger-row { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ledger-row:first-child { border-top: 0; }
.ledger-row .ld { width: 52px; color: var(--muted); font-size: 12px; flex: 0 0 auto; padding-top: 2px; }
.ledger-row .ll { flex: 1; }
.ledger-row .lp { font-weight: 700; color: var(--accent); }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--ink2); letter-spacing: .04em; }

body { background: radial-gradient(140% 50% at 50% 0%, #26305e 0%, #121628 65%) fixed, #121628; }
header { padding: 18px 0 8px; display: flex; justify-content: space-between; align-items: flex-end; }
.brand { font-family: var(--fh); font-weight: 900; font-size: 22px; letter-spacing: .06em; line-height: 1.05; }
.brand small { display: block; font-family: var(--fb); font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 14px; }
.card-t { font-family: var(--fh); font-size: 12px; letter-spacing: .18em; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-t .r { font-family: var(--fb); letter-spacing: 0; font-size: 13px; }
/* rank ladder */
.ladder { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.ladder .rg { height: 12px; border-radius: 4px; opacity: .3; position: relative; }
.ladder .rg.done { opacity: 1; }
.ladder .rg.cur { opacity: 1; box-shadow: 0 0 0 2px var(--ink) ; }
.ladder-names { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 9px; color: var(--muted); text-align: center; margin-top: 4px; letter-spacing: .02em; }
.ladder-names .cur { color: var(--ink); font-weight: 700; }
.rank-line { display: flex; justify-content: space-between; align-items: baseline; }
.rank-big { font-family: var(--fh); font-weight: 900; font-size: 26px; }
.rank-pts { font-size: 14px; color: var(--muted); }
/* week dots */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { text-align: center; font-size: 11px; color: var(--muted); }
.wd .c { height: 40px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 4px; display: grid; place-items: center; font-size: 17px; }
.wd .c.act { background: var(--accent); border-color: var(--accent); }
.wd .c.part { background: var(--accent-soft); }
.wd .c.today { box-shadow: 0 0 0 2px var(--ink2) inset; }
.wd .c.fut { opacity: .35; }
.wk-sum { display: flex; justify-content: space-between; margin-top: 12px; font-size: 14px; }
.wk-sum b { font-family: var(--fh); color: var(--accent); font-size: 20px; }
/* usuals */
.usuals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.usual { min-height: 60px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; font-size: 15px; }
.usual .ic { font-size: 24px; }
.usual small { display: block; font-size: 12px; color: var(--muted); }
.more-link { width: 100%; min-height: 44px; margin-top: 8px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
/* prompt */
.prompt { background: linear-gradient(135deg, #2c2350, #1b2140); border-color: rgba(255,138,91,.35); }
.prompt p { font-size: 15px; margin-bottom: 10px; }
.prompt .row { display: flex; gap: 8px; flex-wrap: wrap; }
.prompt button { flex: 1 1 auto; min-height: 46px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; padding: 0 12px; }
.prompt button.yes { background: var(--pup); color: #2a0e02; border-color: var(--pup); font-weight: 600; }
/* family board */
.fam { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.fam:first-child { border-top: 0; }
.fav { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: 0 0 auto; }
.fname { flex: 1; font-size: 15px; line-height: 1.2; }
.fname small { display: block; font-size: 12px; color: var(--muted); }
.mini { display: flex; gap: 3px; }
.mini i { width: 9px; height: 9px; border-radius: 3px; background: var(--panel2); }
.mini i.on { background: var(--accent); }
.rpill { font-size: 11px; padding: 2px 8px; border-radius: 99px; color: #fff; margin-left: 6px; vertical-align: 2px; }
.quest { margin-top: 12px; }
.quest:first-of-type { margin-top: 0; }
.qtop { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; gap: 8px; }
.qtop small { color: var(--muted); }
.qtop .rw { color: var(--accent); white-space: nowrap; }
.imp { display: flex; gap: 12px; align-items: center; }
.imp p { flex: 1; font-size: 14px; color: var(--muted); }
.imp button { min-height: 46px; padding: 0 16px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
/* log sheet extras */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 44px; min-width: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 15px; }
.chip-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.chip-btn.who.on { border-color: var(--house); background: var(--house); color: #fff; }
.more-btn { min-height: 44px; margin-top: 14px; color: var(--accent); font-size: 14px; text-align: left; }
.num-row { display: flex; gap: 10px; }
.num { flex: 1; font-size: 12px; color: var(--muted); }
.num input { display: block; width: 100%; margin-top: 4px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 0 12px; font-size: 17px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.gain { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; color: var(--ink); }
.gain b { font-family: var(--fh); font-size: 26px; color: var(--accent); }
.imp-row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.imp-row.off { opacity: .45; }
.imp-row small { display: block; color: var(--muted); font-size: 12px; }
.toast { display: flex; align-items: center; gap: 12px; }
.toast-act { min-height: 36px; padding: 0 12px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; }

/* ---------- PUP MODE ---------- */
body.pup { --accent: #ff8a5b; --accent-soft: rgba(255,138,91,.18); --on-accent: #2a0e02; --line: rgba(255,138,91,.22); }
body.pup .card { border-radius: 24px; }
.pup-hi { font-family: var(--fp); font-weight: 800; font-size: 34px; line-height: 1.05; margin-top: 8px; }
.pup-hi small { display: block; font-family: var(--fp); font-weight: 500; font-size: 17px; color: var(--muted); }
.paws { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.paw { text-align: center; font-family: var(--fp); font-size: 13px; color: var(--muted); }
.paw .c { aspect-ratio: 1; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-size: 22px; margin-bottom: 2px; filter: grayscale(1); opacity: .5; }
.paw .c.on { background: var(--pup); filter: none; opacity: 1; }
.paw .c.today { box-shadow: 0 0 0 3px var(--ink2); opacity: 1; }
.pup-msg { font-family: var(--fp); font-size: 19px; font-weight: 700; text-align: center; margin-top: 12px; }
.pup-msg small { display: block; font-weight: 500; font-size: 15px; color: var(--muted); }
.big-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big-act { min-height: 92px; border-radius: 22px; background: var(--panel2); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--fp); font-weight: 700; font-size: 17px; }
.big-act .ic { font-size: 36px; line-height: 1; }
.big-act:active { transform: scale(.97); }
.pup-rank { font-family: var(--fp); font-weight: 800; font-size: 26px; }
.badges4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; font-family: var(--fp); }
.b4 .ic { font-size: 30px; filter: grayscale(1); opacity: .4; }
.b4.t1 .ic, .b4.t2 .ic, .b4.t3 .ic { filter: none; opacity: 1; }
.b4 b { display: block; font-size: 12px; line-height: 1.15; }
.b4 small { font-size: 12px; color: var(--muted); }
.stars { font-size: 11px; letter-spacing: 1px; }
body.pup .fab { font-family: var(--fp); font-weight: 800; letter-spacing: 0; font-size: 19px; }
/* ---------- round 3 ---------- */
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.gear { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); font-size: 20px; flex: 0 0 auto; }
.season-banner { margin-top: 12px; border-radius: 16px; padding: 12px 14px; background: linear-gradient(120deg, rgba(179,38,30,.35), rgba(212,168,42,.25)); border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.season-banner b { font-family: var(--fh); font-size: 18px; display: block; line-height: 1.1; }
.season-banner small { color: var(--ink2); font-size: 13px; }
.season-banner .left { text-align: right; font-family: var(--fh); font-size: 24px; line-height: 1; }
.season-banner .left small { display: block; font-family: var(--fb); font-size: 11px; color: var(--ink2); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: 1fr 1fr 1fr; background: rgba(18,22,40,.96); border-top: 1px solid var(--line);
  padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tabbar button { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.tabbar button span { font-size: 20px; line-height: 1.1; }
.tabbar button.on { color: var(--accent); }
.fab { bottom: calc(76px + env(safe-area-inset-bottom)); }
body { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
.ai-btn { width: 100%; min-height: 48px; margin-top: 4px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); font-size: 15px; }
.ai-text { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 12px; font-size: 16px; font-family: var(--fb); resize: vertical; }
.ai-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
.ai-row .btn-primary { min-height: 48px; }
.goal { padding: 12px 0; border-top: 1px solid var(--line); }
.goal:first-of-type { border-top: 0; }
.goal-top { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.goal-top .gi { font-size: 22px; width: 30px; text-align: center; }
.goal-top .gl { flex: 1; line-height: 1.25; }
.goal-top .gl small { display: block; font-size: 12px; color: var(--muted); }
.goal-top .gv { font-family: var(--fh); font-size: 15px; white-space: nowrap; }
.goal .bar { margin: 8px 0 0 40px; }
.goal.done .bar > i { background: var(--teal); }
.lock { font-size: 11px; color: var(--muted); }
.suggest { border: 1px dashed var(--accent); }
.suggest .goal-top .gl small { font-style: italic; }
.btn-ghost { width: 100%; min-height: 48px; margin-top: 12px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent); font-size: 15px; }
.honors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; font-size: 11px; color: var(--muted); }
.honors .crest { aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 18px; margin-bottom: 4px; }
.honors .crest.cur { border-style: solid; border-color: var(--accent); }
.newfor { background: rgba(79,195,181,.12); border-color: rgba(79,195,181,.4); display: flex; gap: 10px; align-items: center; font-size: 15px; }
.newfor .x { margin-left: auto; }
.dogrow { display: flex; gap: 10px; margin-top: 12px; }
.dog { flex: 1; text-align: center; border-radius: 14px; background: var(--panel2); padding: 10px 6px; font-size: 13px; color: var(--muted); }
.dog b { display: block; font-family: var(--fp); font-size: 22px; color: var(--ink); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 20px; }
.stepper b { min-width: 48px; text-align: center; font-family: var(--fh); }
.edit-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.edit-row .gl { flex: 1; }
body.pup .big-acts { grid-template-columns: repeat(3, 1fr); gap: 8px; }
body.pup .big-act { min-height: 86px; font-size: 14px; border-radius: 18px; }
body.pup .big-act .ic { font-size: 30px; }
</style>
</head>

<div class="proto-bar">Prototype D · Family Pack · demo data, pretend today is Fri Dec 18 · <a href="index.html">all prototypes</a></div>
<div class="wrap">
  <header class="topbar"><div class="brand">THE HOWLERS<small id="season"></small></div><button class="gear" id="gear" type="button" aria-label="Settings">⚙️</button></header>
  <div class="members" id="members"></div>
  <div id="main"></div>
</div>
<button class="fab" id="fab" type="button"></button>
<nav class="tabbar" id="tabbar"></nav>
<script>
/* ============================================================
   THE IRON RAIN — shared prototype engine (Merit scoring + demo data)
   Prototype only: in-memory state, simulated "today" mid-season.
   ============================================================ */

// ---------- DOM helpers (no innerHTML with data, no inline handlers) ----------
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) appendKids(el, arguments[i]);
  return el;
}
function appendKids(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(x => appendKids(el, x)); return; }
  el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  for (let i = 2; i < arguments.length; i++) appendKids(el, arguments[i]);
  return el;

      const g = gainFor([S.me], () => keep.forEach(r => S.workouts.push({ id: nid(), member: S.me, date: r.date, act: r.act, min: r.min, felt: r.felt, detail: r.detail, by: S.me })));
      close(); onDone(); toast('Added ' + keep.length + ' · ' + gainText(g)); } }, 'Add workouts'));
  }
  body.appendChild(ta);
  body.appendChild(h('div', { class: 'ai-row' },
    h('button', { class: 'btn-primary', type: 'button', onclick: () => run(ta.value.trim(), null) }, 'Read it'),
    h('button', { class: 'chip-btn', type: 'button', onclick: () => { if (!hasKey) { toast('Photos need a Claude key — see Settings'); return; } photo.click(); } }, '📷 Photo')));
  body.appendChild(photo); body.appendChild(status);
  body.appendChild(h('p', { class: 'hint' }, hasKey ? 'Uses your Claude key · about 1–2¢ per read.' : 'No Claude key on this phone yet: pasted text uses a simple demo reader.'));

let TAB = 'today';

}
function rankCard(sc, pup) {

    h('div', null, h('b', null, SEASON.name + (SEASON.trial ? ' · ' + SEASON.sub : '')),
      h('small', null, SEASON.trial ? 'December is practice. Everyone starts fresh on Jan 1 for ' + NEXT_SEASON.name + '.' : SEASON.sub + ' · ' + fmtShort(SEASON.start) + ' – ' + fmtShort(SEASON.end))),
    h('div', { class: 'left' }, left, h('small', null, 'days left')));
}
function tkdPrompt() {
  for (let back = 0; back < 3; back++) {
    const d = addDays(SEASON.today, -back);
    if (!TKD_DAYS.includes(dow(d))) continue;
    const went = KIDS.filter(k => S.workouts.some(w => w.member === k && w.date === d && w.act === 'tkd'));
    if (went.length === KIDS.length || S.seen['tkd' + d]) return null;
    const missing = KIDS.filter(k => !went.includes(k)).filter(k => !MEM[S.me].pup || k === S.me);
    if (!missing.length) return null;
    const when = back === 0 ? 'tonight' : back === 1 ? 'yesterday' : DOWS[dow(d)];
    const log = ids => { let wIds; const g = gainFor(ids, () => { wIds = logGroup(ids, { date: d, act: 'tkd', min: 60, felt: 'normal', by: S.me }); }); render(); toast('🥋 ' + gainText(g), 'Undo', () => { S.workouts = S.workouts.filter(w => !wIds.includes(w.id)); render(); }); };
    const q = MEM[S.me].pup ? 'Did you go?' : 'Did ' + missing.map(k => MEM[k].name).join(' & ') + ' go?';
    return h('div', { class: 'card prompt' }, h('p', null, '🥋 Taekwondo was ' + when + '. ' + q),
      h('div', { class: 'row' },
        missing.length > 1 ? h('button', { class: 'yes', type: 'button', onclick: () => log(missing) }, 'Both went') : null,
        missing.map(k => h('button', { class: missing.length === 1 ? 'yes' : '', type: 'button', onclick: () => log([k]) }, MEM[S.me].pup ? 'Yes, I went!' : missing.length > 1 ? 'Just ' + MEM[k].name : 'Yes, ' + MEM[k].name + ' went')),
        h('button', { type: 'button', onclick: () => { S.seen['tkd' + d] = 1; render(); toast('No worries. Streaks are weekly, not daily.'); } }, 'Skipped')));
  }
  return null;
}
// "Mom added Taekwondo for you" — entries someone else logged since you last looked
function newForYou() {
  const mine = S.workouts.filter(w => w.member === S.me && w.by && w.by !== S.me && !S.seen[w.id] && w.date >= addDays(SEASON.today, -7));
  if (!mine.length) return null;
  const who = MEM[mine[mine.length - 1].by].name;
  const acts = mine.map(w => ACT[w.act].icon + ' ' + ACT[w.act].name + ' (' + DOWS[dow(w.date)] + ')').join(', ');
  return h('div', { class: 'card newfor' }, h('span', { style: 'font-size:22px' }, '📬'), h('span', null, who + ' added ' + acts + ' for you.'),
    h('button', { class: 'modal-x x', type: 'button', 'aria-label': 'Dismiss', onclick: () => { mine.forEach(w => S.seen[w.id] = 1); render(); } }, '✓'));
}
function familyBoard(all) {

function questsCard() {

}

// ---------- Goals tab ----------
function goalRow(mid, g, scope) {
  const T = GOAL_TYPES[g.type], st = goalStatus(mid, g, scope), mine = mid === S.me;
  const showVal = !T.private || mine;
  const unitBonus = MEM[mid].pup ? RULES.pup : RULES.pack;
  return h('div', { class: 'goal' + (st.done ? ' done' : '') },
    h('div', { class: 'goal-top' }, h('span', { class: 'gi' }, T.icon),
      h('span', { class: 'gl' }, showVal ? T.label(g.target) : 'Private progress goal', h('small', null,
        (st.done ? '✓ Done! +' : '+') + (scope === 'month' ? unitBonus.goalMonth : unitBonus.goalSeason) + ' ' + unitBonus.unit +
        (st.done ? '' : st.onPace ? ' · on pace' : ' · a little behind pace') + (T.private ? ' · 🔒 only you see the number' : ''))),
      h('span', { class: 'gv' }, showVal ? (T.step ? st.v.toFixed(1) : st.v) + '/' + g.target : Math.round(st.pct * 100) + '%')),
    h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round(st.pct * 100) + '%' })));
}
function openGoalEditor(scope) {
  const mid = S.me, m = MEM[mid], list = S.goals[mid][scope].map(g => Object.assign({}, g));
  const body = h('div', { class: 'log-body' });
  function draw() {
    clear(body);
    body.appendChild(h('p', { class: 'hint', style: 'font-size:14px' }, scope === 'month' ? 'Pick up to 3 goals for ' + monthWindow().name + '.' : 'Pick up to 2 goals for ' + SEASON.name + '.'));
    Object.keys(GOAL_TYPES).filter(k => GOAL_TYPES[k].who === 'all' || GOAL_TYPES[k].who === (m.pup ? 'kid' : 'adult')).forEach(k => {
      const T = GOAL_TYPES[k], g = list.find(x => x.type === k), max = scope === 'month' ? 3 : 2;
      const step = T.step || (T.unit === 'min' ? 60 : 1);
      body.appendChild(h('div', { class: 'edit-row' }, h('span', { class: 'gi' }, T.icon), h('span', { class: 'gl' }, g ? T.label(g.target) : T.label('…').replace('… ', '')),
        g ? h('div', { class: 'stepper' },
          h('button', { type: 'button', 'aria-label': 'Less', onclick: () => { g.target = Math.max(step, Math.round((g.target - step) * 10) / 10); draw(); } }, '−'),
          h('b', null, g.target),
          h('button', { type: 'button', 'aria-label': 'More', onclick: () => { g.target = Math.round((g.target + step) * 10) / 10; draw(); } }, '+'),
          h('button', { type: 'button', 'aria-label': 'Remove', onclick: () => { list.splice(list.indexOf(g), 1); draw(); } }, '✕'))
          : h('button', { class: 'chip-btn', type: 'button', onclick: () => { if (list.length >= max) { toast('Up to ' + max + ' goals'); return; } list.push({ type: k, target: T.step ? 1 : T.unit === 'min' ? 600 : 8 }); draw(); } }, 'Add')));
    });
    body.appendChild(h('button', { class: 'btn-primary', type: 'button', style: 'margin-top:14px', onclick: () => { S.goals[mid][scope] = list; close(); render(); toast('Goals saved'); } }, 'Save goals'));
  }
  const close = openModal(scope === 'month' ? monthWindow().name + ' goals' : SEASON.name + ' goals', body); draw();
}
function renderGoals(main, all) {
  const mid = S.me, m = MEM[mid], G = S.goals[mid], mw = monthWindow();
  const pupVoice = m.pup;
  const month = h('div', { class: 'card' }, h('div', { class: 'card-t' }, h('span', null, (pupVoice ? 'MY ' : '') + mw.name.toUpperCase() + ' GOALS'), h('span', { class: 'r' }, daysBetween(SEASON.today, mw.b) + ' days left')));
  G.month.forEach(g => month.appendChild(goalRow(mid, g, 'month')));

  G.season.forEach(g => season.appendChild(goalRow(mid, g, 'season')));
  season.appendChild(h('button', { class: 'btn-ghost', type: 'button', onclick: () => openGoalEditor('season') }, 'Edit season goals'));
  main.appendChild(season);
  if (SEASON.trial) {
    const sug = h('div', { class: 'card suggest' }, h('div', { class: 'card-t' }, h('span', null, 'SUGGESTED FOR ' + NEXT_SEASON.name.toUpperCase()), h('span', { class: 'r' }, 'from your December')));

  SEASONS.forEach(s => hon.appendChild(h('div', null, h('div', { class: 'crest' + (s.id === SEASON.id ? ' cur' : ''), style: s.id === SEASON.id ? 'background:' + all[mid].rank.rank.color + '33' : '' }, s.id === SEASON.id ? '⏳' : s.trial ? '🎯' : '·'), s.trial ? 'Trial' : s.name.replace('Season ', 'S'))));
  main.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-t' }, h('span', null, 'HALL OF HONORS'), h('span', { class: 'r' }, 'your finishing color, each season')), hon));

    h('button', { class: 'ai-btn', type: 'button', style: 'margin-top:10px', onclick: () => openAIReader(render) }, '✨ Paste or snap a Peloton summary'),

  main.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-t' }, h('span', null, 'RECENT ' + NAMES.adultUnit.toUpperCase())), led));

function renderPupToday(main, all) {

  main.appendChild(h('div', { class: 'pup-hi' }, 'Hi ' + m.name + '! 🐾', h('small', null, sc.chain ? 'Your streak is on fire ' + '🔥'.repeat(sc.chain) : 'Every day you move earns a paw print.')));

  acts.appendChild(h('button', { class: 'big-act', type: 'button', onclick: () => openLog(render) }, h('span', { class: 'ic' }, '➕'), 'Other'));

  main.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-t' }, h('span', null, 'MY BADGES')), bg));
}
function renderPack(main, all) {
  main.appendChild(familyBoard(all));
  main.appendChild(questsCard());
}

function render() {
  const all = scoreAll(), me = MEM[S.me];
  document.body.classList.toggle('pup', me.pup);
  document.getElementById('season').textContent = NAMES.pack + ' · ' + (me.pup ? NAMES.kids : NAMES.adults);
  document.getElementById('fab').textContent = me.pup ? '🐾 I moved!' : '＋ Log Trial';
  const mem = clear(document.getElementById('members'));
  MEMBERS.forEach(x => mem.appendChild(h('button', { class: 'mchip' + (x.id === S.me ? ' on' : ''), type: 'button', onclick: () => { S.me = x.id; render(); scrollTo(0, 0); } },
    h('span', { class: 'dot', style: 'background:' + x.house }, x.pup ? '🐾' : x.name[0]), x.name + "'s phone")));
  const tb = clear(document.getElementById('tabbar'));
  [['today', '🏠', 'Today'], ['goals', '🎯', 'Goals'], ['pack', '🐺', 'Pack']].forEach(t => tb.appendChild(h('button', { class: TAB === t[0] ? 'on' : '', type: 'button', onclick: () => { TAB = t[0]; render(); scrollTo(0, 0); } }, h('span', null, t[1]), t[2])));
  const main = clear(document.getElementById('main'));
  main.appendChild(seasonBanner());
  if (TAB === 'today') (me.pup ? renderPupToday : renderPackToday)(main, all);
  else if (TAB === 'goals') renderGoals(main, all);
  else renderPack(main, all);
}
document.getElementById('fab').addEventListener('click', () => openLog(render));
document.getElementById('gear').addEventListener('click', () => openSettings(render));
