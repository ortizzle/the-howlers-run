<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121628">
<title>Howlers Family Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Baloo+2:wght@500;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121628; --panel: #1b2140; --panel2: #252c52; --ink: #f3ecdc; --ink2: #ffe3b0; --muted: #a2a3bf;
  --line: rgba(242,169,59,.2); --accent: #f2a93b; --accent-soft: rgba(242,169,59,.16); --on-accent: #1a1405;
  --pup: #ff8a5b; --teal: #4fc3b5; --fh: 'Cinzel', Georgia, serif; --fb: 'Spectral', Georgia, serif; --fp: 'Baloo 2', system-ui, sans-serif;
}
/*BASE_CSS*/
body { background: radial-gradient(140% 50% at 50% 0%, #26305e 0%, #121628 65%) fixed, #121628; }
header { padding: 18px 0 8px; display: flex; justify-content: space-between; align-items: flex-end; }
.brand { font-family: var(--fh); font-weight: 900; font-size: 22px; letter-spacing: .06em; line-height: 1.05; }
.brand small { display: block; font-family: var(--fb); font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 14px; }
.card-t { font-family: var(--fh); font-size: 12px; letter-spacing: .18em; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-t .r { font-family: var(--fb); letter-spacing: 0; font-size: 13px; }
/* rank ladder */
.ladder { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.ladder .rg { height: 12px; border-radius: 4px; opacity: .3; position: relative; }
.ladder .rg.done { opacity: 1; }
.ladder .rg.cur { opacity: 1; box-shadow: 0 0 0 2px var(--ink) ; }
.ladder-names { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 9px; color: var(--muted); text-align: center; margin-top: 4px; letter-spacing: .02em; }
.ladder-names .cur { color: var(--ink); font-weight: 700; }
.rank-line { display: flex; justify-content: space-between; align-items: baseline; }
.rank-big { font-family: var(--fh); font-weight: 900; font-size: 26px; }
.rank-pts { font-size: 14px; color: var(--muted); }
/* week dots */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { text-align: center; font-size: 11px; color: var(--muted); }
.wd .c { height: 40px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 4px; display: grid; place-items: center; font-size: 17px; }
.wd .c.act { background: var(--accent); border-color: var(--accent); }
.wd .c.part { background: var(--accent-soft); }
.wd .c.today { box-shadow: 0 0 0 2px var(--ink2) inset; }
.wd .c.fut { opacity: .35; }
.wk-sum { display: flex; justify-content: space-between; margin-top: 12px; font-size: 14px; }
.wk-sum b { font-family: var(--fh); color: var(--accent); font-size: 20px; }
/* usuals */
.usuals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.usual { min-height: 60px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; font-size: 15px; }
.usual .ic { font-size: 24px; }
.usual small { display: block; font-size: 12px; color: var(--muted); }
.more-link { width: 100%; min-height: 44px; margin-top: 8px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
/* prompt */
.prompt { background: linear-gradient(135deg, #2c2350, #1b2140); border-color: rgba(255,138,91,.35); }
.prompt p { font-size: 15px; margin-bottom: 10px; }
.prompt .row { display: flex; gap: 8px; flex-wrap: wrap; }
.prompt button { flex: 1 1 auto; min-height: 46px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; padding: 0 12px; }
.prompt button.yes { background: var(--pup); color: #2a0e02; border-color: var(--pup); font-weight: 600; }
/* family board */
.fam { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.fam:first-child { border-top: 0; }
.fav { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: 0 0 auto; }
.fname { flex: 1; font-size: 15px; line-height: 1.2; }
.fname small { display: block; font-size: 12px; color: var(--muted); }
.mini { display: flex; gap: 3px; }
.mini i { width: 9px; height: 9px; border-radius: 3px; background: var(--panel2); }
.mini i.on { background: var(--accent); }
.rpill { font-size: 11px; padding: 2px 8px; border-radius: 99px; color: #fff; margin-left: 6px; vertical-align: 2px; }
.quest { margin-top: 12px; }
.quest:first-of-type { margin-top: 0; }
.qtop { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; gap: 8px; }
.qtop small { color: var(--muted); }
.qtop .rw { color: var(--accent); white-space: nowrap; }
.imp { display: flex; gap: 12px; align-items: center; }
.imp p { flex: 1; font-size: 14px; color: var(--muted); }
.imp button { min-height: 46px; padding: 0 16px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
/* log sheet extras */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 44px; min-width: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 15px; }
.chip-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.chip-btn.who.on { border-color: var(--house); background: var(--house); color: #fff; }
.more-btn { min-height: 44px; margin-top: 14px; color: var(--accent); font-size: 14px; text-align: left; }
.num-row { display: flex; gap: 10px; }
.num { flex: 1; font-size: 12px; color: var(--muted); }
.num input { display: block; width: 100%; margin-top: 4px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 0 12px; font-size: 17px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.gain { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; color: var(--ink); }
.gain b { font-family: var(--fh); font-size: 26px; color: var(--accent); }
.imp-row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.imp-row.off { opacity: .45; }
.imp-row small { display: block; color: var(--muted); font-size: 12px; }
.toast { display: flex; align-items: center; gap: 12px; }
.toast-act { min-height: 36px; padding: 0 12px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; }

/* ---------- PUP MODE ---------- */
body.pup { --accent: #ff8a5b; --accent-soft: rgba(255,138,91,.18); --on-accent: #2a0e02; --line: rgba(255,138,91,.22); }
body.pup .card { border-radius: 24px; }
.pup-hi { font-family: var(--fp); font-weight: 800; font-size: 34px; line-height: 1.05; margin-top: 8px; }
.pup-hi small { display: block; font-family: var(--fp); font-weight: 500; font-size: 17px; color: var(--muted); }
.paws { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.paw { text-align: center; font-family: var(--fp); font-size: 13px; color: var(--muted); }
.paw .c { aspect-ratio: 1; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-size: 22px; margin-bottom: 2px; filter: grayscale(1); opacity: .5; }
.paw .c.on { background: var(--pup); filter: none; opacity: 1; }
.paw .c.today { box-shadow: 0 0 0 3px var(--ink2); opacity: 1; }
.pup-msg { font-family: var(--fp); font-size: 19px; font-weight: 700; text-align: center; margin-top: 12px; }
.pup-msg small { display: block; font-weight: 500; font-size: 15px; color: var(--muted); }
.big-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big-act { min-height: 92px; border-radius: 22px; background: var(--panel2); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--fp); font-weight: 700; font-size: 17px; }
.big-act .ic { font-size: 36px; line-height: 1; }
.big-act:active { transform: scale(.97); }
.pup-rank { font-family: var(--fp); font-weight: 800; font-size: 26px; }
.badges4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; font-family: var(--fp); }
.b4 .ic { font-size: 30px; filter: grayscale(1); opacity: .4; }
.b4.t1 .ic, .b4.t2 .ic, .b4.t3 .ic { filter: none; opacity: 1; }
.b4 b { display: block; font-size: 12px; line-height: 1.15; }
.b4 small { font-size: 12px; color: var(--muted); }
.stars { font-size: 11px; letter-spacing: 1px; }
body.pup .fab { font-family: var(--fp); font-weight: 800; letter-spacing: 0; font-size: 19px; }
/* ---------- round 3 ---------- */
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.gear { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); font-size: 20px; flex: 0 0 auto; }
.season-banner { margin-top: 12px; border-radius: 16px; padding: 12px 14px; background: linear-gradient(120deg, rgba(179,38,30,.35), rgba(212,168,42,.25)); border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.season-banner b { font-family: var(--fh); font-size: 18px; display: block; line-height: 1.1; }
.season-banner small { color: var(--ink2); font-size: 13px; }
.season-banner .left { text-align: right; font-family: var(--fh); font-size: 24px; line-height: 1; }
.season-banner .left small { display: block; font-family: var(--fb); font-size: 11px; color: var(--ink2); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(18,22,40,.96); border-top: 1px solid var(--line);
  padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tabbar button { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.tabbar button span { font-size: 20px; line-height: 1.1; }
.tabbar button.on { color: var(--accent); }
.fab { bottom: calc(76px + env(safe-area-inset-bottom)); }
body { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
.ai-btn { width: 100%; min-height: 48px; margin-top: 4px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); font-size: 15px; }
.ai-text { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 12px; font-size: 16px; font-family: var(--fb); resize: vertical; }
.ai-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
.ai-row .btn-primary { min-height: 48px; }
.goal { padding: 12px 0; border-top: 1px solid var(--line); }
.goal:first-of-type { border-top: 0; }
.goal-top { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.goal-top .gi { font-size: 22px; width: 30px; text-align: center; }
.goal-top .gl { flex: 1; line-height: 1.25; }
.goal-top .gl small { display: block; font-size: 12px; color: var(--muted); }
.goal-top .gv { font-family: var(--fh); font-size: 15px; white-space: nowrap; }
.goal .bar { margin: 8px 0 0 40px; }
.goal.done .bar > i { background: var(--teal); }
.lock { font-size: 11px; color: var(--muted); }
.suggest { border: 1px dashed var(--accent); }
.suggest .goal-top .gl small { font-style: italic; }
.btn-ghost { width: 100%; min-height: 48px; margin-top: 12px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent); font-size: 15px; }
.honors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; font-size: 11px; color: var(--muted); }
.honors .crest { aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 18px; margin-bottom: 4px; }
.honors .crest.cur { border-style: solid; border-color: var(--accent); }
.newfor { background: rgba(79,195,181,.12); border-color: rgba(79,195,181,.4); display: flex; gap: 10px; align-items: center; font-size: 15px; }
.newfor .x { margin-left: auto; }
.dogrow { display: flex; gap: 10px; margin-top: 12px; }
.dog { flex: 1; text-align: center; border-radius: 14px; background: var(--panel2); padding: 10px 6px; font-size: 13px; color: var(--muted); }
.dog b { display: block; font-family: var(--fp); font-size: 22px; color: var(--ink); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 20px; }
.stepper b { min-width: 48px; text-align: center; font-family: var(--fh); }
.edit-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.edit-row .gl { flex: 1; }
body.pup .big-acts { grid-template-columns: repeat(3, 1fr); gap: 8px; }
body.pup .big-act { min-height: 86px; font-size: 14px; border-radius: 18px; }
body.pup .big-act .ic { font-size: 30px; }
/* ---------- round 4 ---------- */
.logcard .usuals { margin-bottom: 8px; }
.wrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin-top: 10px; }
.wrow label { font-size: 14px; color: var(--muted); }
.wrow input { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 0 12px; font-size: 17px; width: 100%; }
.wrow button { min-height: 48px; padding: 0 16px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.wrow small { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.coach { display: flex; gap: 12px; align-items: flex-start; }
.coach .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--fh); font-weight: 900; font-size: 18px; color: #fff; flex: 0 0 auto; }
.coach .cbody { flex: 1; }
.coach small { display: block; font-family: var(--fh); font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.coach p { font-style: italic; font-size: 16px; margin-top: 2px; }
.coach .ask { margin-top: 8px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.metric { background: var(--panel2); border-radius: 12px; padding: 10px 6px; text-align: center; }
.metric b { display: block; font-family: var(--fh); font-size: 20px; line-height: 1.1; }
.metric span { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.metric.go b { color: var(--teal); }
.fuel { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.fuel .fl { font-size: 14px; }
.fuel .fl .bar { margin: 4px 0 8px; height: 7px; }
.fuel a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-size: 14px; white-space: nowrap; }
.cheer-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.cheer-row:first-of-type { border-top: 0; }
.cheer-row .ce { font-size: 24px; }
.cheer-row .ct { flex: 1; line-height: 1.3; }
.cheer-row .ct small { display: block; color: var(--muted); font-size: 12px; }
.act-feed { padding: 12px 0; border-top: 1px solid var(--line); }
.act-feed:first-of-type { border-top: 0; }
.act-feed .who { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.act-feed .who small { display: block; color: var(--muted); font-size: 12px; }
.emoji-row { display: flex; gap: 6px; margin-top: 8px; padding-left: 48px; flex-wrap: wrap; }
.emoji-row button { min-width: 44px; min-height: 40px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-size: 18px; }
.emoji-row button.note { font-size: 13px; padding: 0 10px; color: var(--muted); }
.emoji-row button.done { border-color: var(--teal); background: rgba(79,195,181,.15); }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats4 .metric b { font-size: 17px; }
.chart text { font-family: var(--fb); font-size: 10px; fill: var(--muted); }
.private { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 8px; }
.ladder2 { display: flex; flex-direction: column-reverse; gap: 3px; }
.rung { display: flex; align-items: center; gap: 10px; font-size: 12px; min-height: 28px; }
.rung .lvl { width: 44px; text-align: right; color: var(--muted); }
.rung .bx { flex: 1; height: 24px; border-radius: 6px; border: 1px dashed var(--line); display: flex; align-items: center; padding: 0 10px; color: var(--muted); }
.rung.done .bx { background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); font-weight: 600; }
.rung.ms .bx { border-style: solid; }
.rung.cap .bx { background: repeating-linear-gradient(45deg, rgba(242,169,59,.15) 0 6px, transparent 6px 12px); border-style: solid; color: var(--accent); }
.wkrow { display: grid; grid-template-columns: 62px 1fr 48px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.wkrow:first-of-type { border-top: 0; }
.wkrow .seg { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--panel2); }
.wkrow .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.wkrow .pts { font-family: var(--fh); font-size: 18px; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.mix { display: grid; grid-template-columns: 28px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; margin-top: 6px; }
.mix .v { text-align: right; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .h { font-size: 10px; text-align: center; color: var(--muted); }
.cal .d { aspect-ratio: 1; border-radius: 8px; font-size: 11px; display: grid; place-items: center; color: var(--muted); background: var(--panel2); }
.cal .d.on { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.cal .d.fut { opacity: .35; }
.cal .d.today { box-shadow: 0 0 0 2px var(--ink2) inset; }
.set-sec { margin-top: 18px; }
.set-sec:first-of-type { margin-top: 4px; }
.set-sec h3 { font-family: var(--fh); font-size: 13px; letter-spacing: .14em; color: var(--accent); margin-bottom: 8px; }
.set-sec p { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.toggle { display: flex; align-items: center; justify-content: space-between; min-height: 48px; font-size: 15px; width: 100%; text-align: left; }
.toggle .sw { width: 50px; height: 30px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); position: relative; flex: 0 0 auto; }
.toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.toggle.on .sw { background: var(--accent); }
.toggle.on .sw::after { left: 23px; background: var(--on-accent); }
.txt { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 0 12px; font-size: 16px; width: 100%; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>
<div class="proto-bar">Prototype D · Family Pack · demo data, pretend today is Fri Dec 18 · <a href="index.html">all prototypes</a></div>
<div class="wrap">
  <header class="topbar"><div class="brand">THE HOWLERS<small id="season"></small></div><button class="gear" id="gear" type="button" aria-label="Settings">⚙️</button></header>
  <div class="members" id="members"></div>
  <div id="main"></div>
</div>
<button class="fab" id="fab" type="button"></button>
<nav class="tabbar" id="tabbar"></nav>
<script>
/*ENGINE*/

let TAB = 'today';
const coachMsg = {}; // AI replies, per person, this session
const CAT_COLORS = { consistency: '#f2a93b', effort: '#ff8a5b', progress: '#4fc3b5', together: '#a78bfa', habits: '#888' };
const CAT_LABEL = { consistency: 'Showing up', effort: 'Effort', progress: 'Progress', together: 'Together & cheers' };

// ---------- shared pieces ----------
function card(title, right) { const c = h('div', { class: 'card' }); if (title) c.appendChild(h('div', { class: 'card-t' }, h('span', null, title), right ? h('span', { class: 'r' }, right) : null)); return c; }
function ladderEl(sc) {

function weightChart(w) {
  const W = 520, H = 220, L = 34, R = 10, T = 12, B = 24, x0 = SEASON.start, x1 = addDays(SEASON.today, 3), span = daysBetween(x0, x1);
  const lo = Math.min(...w.series.map(p => p.lbs)) - 2, hi = Math.max(w.start, ...w.series.map(p => p.lbs)) + 1;
  const X = d => L + daysBetween(x0, d) / span * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const g = s('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', width: '100%', role: 'img', 'aria-label': 'Weight trend' });
  const corr = d => { const k = daysBetween(x0, d) / 7; return [w.start * (1 - 0.005 * k), w.start * (1 - 0.01 * k)]; };
  g.appendChild(s('polygon', { points: [x0, x1].map(d => X(d) + ',' + Y(corr(d)[0])).concat([x1, x0].map(d => X(d) + ',' + Y(corr(d)[1]))).join(' '), fill: 'rgba(79,195,181,.14)' }));
  for (let v = Math.ceil(lo); v <= hi; v += 2) { g.appendChild(s('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: 'rgba(255,255,255,.07)' })); g.appendChild(s('text', { x: L - 6, y: Y(v) + 3, 'text-anchor': 'end' }, v)); }
  if (w.goalLbs <= lo) g.appendChild(s('text', { x: W - R, y: H - B - 4, 'text-anchor': 'end', style: 'fill:#f2a93b' }, 'goal ' + w.goalLbs.toFixed(1) + ' ↓'));
  ['2026-12-01', '2026-12-08', '2026-12-15'].forEach(d => g.appendChild(s('text', { x: X(d), y: H - 6, 'text-anchor': 'middle' }, fmtShort(d))));
  w.series.forEach(p => g.appendChild(s('circle', { cx: X(p.date), cy: Y(p.lbs), r: 3, fill: 'rgba(243,236,220,.3)' })));
  g.appendChild(s('polyline', { points: w.series.map(p => X(p.date) + ',' + Y(p.trend)).join(' '), fill: 'none', stroke: '#f2a93b', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  const last = w.series[w.series.length - 1]; g.appendChild(s('circle', { cx: X(last.date), cy: Y(last.trend), r: 5, fill: '#f2a93b', stroke: '#121628', 'stroke-width': 2 }));
  return g;
}

  const cc = card('ACTIVE DAYS · ' + SEASON.name.toUpperCase(), Object.keys(sc.day).filter(d => sc.isActive(d)).length + ' so far'); cc.appendChild(activeCalendar(sc)); main.appendChild(cc);
  main.appendChild(scorecards(sc));
  if (m.pup) {
    const bg = h('div', { class: 'badges4' });
    pupBadges(m.id).forEach(b => bg.appendChild(h('div', { class: 'b4 t' + b.tier }, h('div', { class: 'ic' }, b.icon), h('b', null, b.name), h('div', { class: 'stars' }, '★'.repeat(b.tier) + '☆'.repeat(3 - b.tier)), h('small', null, b.v + (b.tiers[b.tier] ? '/' + b.tiers[b.tier] : '')))));
    const bc = card('MY BADGES'); bc.appendChild(bg); main.appendChild(bc);
  }
  main.appendChild(rankCard(sc));
  const led = card('RECENT MERIT');
  sc.ledger.slice(0, 10).forEach(e => led.appendChild(h('div', { class: 'ledger-row' }, h('span', { class: 'ld' }, fmtShort(e.date)), h('span', { class: 'll' }, e.label), h('span', { class: 'lp' }, '+' + e.pts))));
  main.appendChild(led);
}

// ---------- GOALS ----------
function goalRow(mid, g, scope) {
  const T = GOAL_TYPES[g.type], st = goalStatus(mid, g, scope), R = MEM[mid].pup ? RULES.pup : RULES.pack;
  return h('div', { class: 'goal' + (st.done ? ' done' : '') },
    h('div', { class: 'goal-top' }, h('span', { class: 'gi' }, T.icon),
      h('span', { class: 'gl' }, T.label(g.target), h('small', null, (st.done ? '✓ Done! +' : '+') + (scope === 'month' ? R.goalMonth : R.goalSeason) + ' Merit' + (st.done ? '' : st.onPace ? ' · on pace' : ' · a little behind pace') + (T.private ? ' · 🔒 only you see this' : ''))),
      h('span', { class: 'gv' }, (T.step ? st.v.toFixed(1) : st.v) + '/' + g.target)),
    h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round(st.pct * 100) + '%' })));
}
function openGoalEditor(scope) {
  const mid = S.me, m = MEM[mid], list = S.goals[mid][scope].map(g => Object.assign({}, g)), body = h('div', { class: 'log-body' });
  function draw() {
    clear(body);
    body.appendChild(h('p', { class: 'hint', style: 'font-size:14px' }, scope === 'month' ? 'Pick up to 3 goals for ' + monthWindow().name + '.' : 'Pick up to 2 goals for ' + SEASON.name + '.'));
    Object.keys(GOAL_TYPES).filter(k => GOAL_TYPES[k].who === 'all' || GOAL_TYPES[k].who === (m.pup ? 'kid' : 'adult')).forEach(k => {
      const T = GOAL_TYPES[k], g = list.find(x => x.type === k), max = scope === 'month' ? 3 : 2, step = T.step || (T.unit === 'min' ? 60 : 1);
      body.appendChild(h('div', { class: 'edit-row' }, h('span', { class: 'gi' }, T.icon), h('span', { class: 'gl' }, g ? T.label(g.target) : T.label('…').replace('… ', '')),
        g ? h('div', { class: 'stepper' },
          h('button', { type: 'button', 'aria-label': 'Less', onclick: () => { g.target = Math.max(step, Math.round((g.target - step) * 10) / 10); draw(); } }, '−'), h('b', null, g.target),
          h('button', { type: 'button', 'aria-label': 'More', onclick: () => { g.target = Math.round((g.target + step) * 10) / 10; draw(); } }, '+'),
          h('button', { type: 'button', 'aria-label': 'Remove', onclick: () => { list.splice(list.indexOf(g), 1); draw(); } }, '✕'))
          : h('button', { class: 'chip-btn', type: 'button', onclick: () => { if (list.length >= max) { toast('Up to ' + max + ' goals'); return; } list.push({ type: k, target: T.step ? 1 : T.unit === 'min' ? 600 : 8 }); draw(); } }, 'Add')));
    });
    body.appendChild(h('button', { class: 'btn-primary', type: 'button', style: 'margin-top:14px', onclick: () => { S.goals[mid][scope] = list; close(); render(); toast('Goals saved'); } }, 'Save goals'));
  }
  const close = openModal(scope === 'month' ? monthWindow().name + ' goals' : SEASON.name + ' goals', body); draw();
}
function renderGoals(main, all) {
  const mid = S.me, G = S.goals[mid], mw = monthWindow();
  const month = card(mw.name.toUpperCase() + ' GOALS', daysBetween(SEASON.today, mw.b) + ' days left');
  G.month.forEach(g => month.appendChild(goalRow(mid, g, 'month')));
  month.appendChild(h('button', { class: 'btn-ghost', type: 'button', onclick: () => openGoalEditor('month') }, 'Edit ' + mw.name + ' goals')); main.appendChild(month);
  const season = card(SEASON.name.toUpperCase() + ' GOALS', SEASON.trial ? 'practice round' : 'this quarter');
  G.season.forEach(g => season.appendChild(goalRow(mid, g, 'season')));
  season.appendChild(h('button', { class: 'btn-ghost', type: 'button', onclick: () => openGoalEditor('season') }, 'Edit season goals')); main.appendChild(season);
  if (SEASON.trial) {
    const sug = card('SUGGESTED FOR ' + NEXT_SEASON.name.toUpperCase(), 'from your December'); sug.classList.add('suggest');
    suggestGoals(mid).forEach(g => { const T = GOAL_TYPES[g.type]; sug.appendChild(h('div', { class: 'goal' }, h('div', { class: 'goal-top' }, h('span', { class: 'gi' }, T.icon),
      h('span', { class: 'gl' }, 'January: ' + T.label(g.target).replace(/^[A-Z]/, c => c.toLowerCase()).replace('cookie', 'Cookie'), h('small', null, g.why))))); });
    sug.appendChild(h('div', { class: 'hint' }, 'On Jan 1 everyone gets a 2-minute goal check-in with these pre-filled.')); main.appendChild(sug);
  }
  const hon = h('div', { class: 'honors' });
  SEASONS.forEach(x => hon.appendChild(h('div', null, h('div', { class: 'crest' + (x.id === SEASON.id ? ' cur' : '') }, x.id === SEASON.id ? '⏳' : x.trial ? '🎯' : '·'), x.trial ? 'Trial' : x.name.replace('Season ', 'S'))));
  const hc = card('HALL OF HONORS', 'your finishing color each season'); hc.appendChild(hon); main.appendChild(hc);
}

// ---------- PACK ----------
function familyBoard(all) {
  const c = card('THE ' + NAMES.pack.toUpperCase(), 'everyone climbs their own ladder');
  MEMBERS.forEach(m => { const sc = all[m.id], mini = h('div', { class: 'mini' });
    range(sc.cur.key, addDays(sc.cur.key, 6)).forEach(d => mini.appendChild(h('i', { class: sc.isActive(d) ? 'on' : '' })));
    const w = !m.pup && S.cfg.people[m.id].share ? weightSeries(m.id) : null;
    c.appendChild(h('div', { class: 'fam' }, h('div', { class: 'fav', style: 'background:' + m.house }, m.pup ? '🐾' : m.name[0]),
      h('div', { class: 'fname' }, m.name, h('span', { class: 'rpill', style: 'background:' + sc.rank.rank.color }, sc.rank.rank.name),
        h('small', null, sc.cur.active + '/' + sc.R.standardDays + ' this week' + (sc.cur.standard ? ' ✦' : '') + (sc.chain ? ' · ' + '🔥'.repeat(sc.chain) : '') + (w ? ' · ▼' + w.pct.toFixed(1) + '%' : ''))), mini)); });
  return c;
}
function cheerFeed() {
  const c = card('CHEER SOMEONE ON', '+2 Merit per cheer · up to 5 a day');
  const seen = {}, items = S.workouts.filter(w => w.member !== S.me && w.date >= addDays(SEASON.today, -2) && w.date <= SEASON.today)
    .sort((a, b) => a.date < b.date ? 1 : -1).filter(w => { const k = (w.group || w.id) + w.member; if (seen[k]) return false; seen[k] = 1; return true; }).slice(0, 6);
  if (!items.length) c.appendChild(h('p', { class: 'hint' }, 'Nobody else has logged in the last couple of days.'));
  items.forEach(w => { const m = MEM[w.member], sent = S.cheers.find(x => x.from === S.me && x.to === w.member && x.date === SEASON.today);
    c.appendChild(h('div', { class: 'act-feed' },
      h('div', { class: 'who' }, h('div', { class: 'fav', style: 'background:' + m.house }, m.pup ? '🐾' : m.name[0]),
        h('div', null, m.name + ' · ' + ACT[w.act].icon + ' ' + ACT[w.act].name + ' ' + w.min + 'm', h('small', null, fmtDow(w.date) + (w.dogs ? ' · with ' + w.dogs.map(d => DOGS.find(x => x.id === d).name).join(' & ') : '')))),
      h('div', { class: 'emoji-row' }, CHEER_EMOJI.map(e => h('button', { class: sent && sent.emoji === e ? 'done' : '', type: 'button', 'aria-label': 'Cheer ' + e, onclick: () => { cheer(w.member, e, ''); render(); toast(e + ' sent to ' + m.name + ' · +2 Merit'); } }, e)),
        h('button', { class: 'note', type: 'button', onclick: () => openCheerNote(w.member) }, '✍️ note')))); });
  return c;
}
function openCheerNote(to) {
  const body = h('div', { class: 'log-body' }), inp = h('input', { class: 'txt', type: 'text', maxlength: '140', placeholder: 'Say something kind…' });
  let emoji = '👏';
  const emo = h('div', { class: 'chips' }); const drawE = () => { clear(emo); CHEER_EMOJI.forEach(e => emo.appendChild(h('button', { class: 'chip-btn' + (e === emoji ? ' on' : ''), type: 'button', onclick: () => { emoji = e; drawE(); } }, e))); }; drawE();
  body.appendChild(emo);
  body.appendChild(h('div', { class: 'chips', style: 'margin-top:10px' }, CHEER_PRESETS.map(t => h('button', { class: 'chip-btn', type: 'button', onclick: () => { inp.value = t; } }, t))));
  body.appendChild(h('div', { style: 'margin-top:10px' }, inp));
  body.appendChild(h('button', { class: 'btn-primary', type: 'button', style: 'margin-top:12px', onclick: () => { cheer(to, emoji, inp.value.trim()); close(); render(); toast(emoji + ' Cheer sent to ' + MEM[to].name); } }, 'Send cheer'));
  const close = openModal('Cheer ' + MEM[to].name, body);
}
function cheerWall() {
  const c = card('CHEER WALL', 'the whole family');
  S.cheers.slice(0, 6).forEach(x => c.appendChild(h('div', { class: 'cheer-row' }, h('span', { class: 'ce' }, x.emoji),
    h('span', { class: 'ct' }, MEM[x.from].name + ' → ' + MEM[x.to].name + (x.text ? ': "' + x.text + '"' : ''), h('small', null, fmtDow(x.date))))));
  return c;
}
function renderPack(main, all) {
  main.appendChild(cheerFeed());
  main.appendChild(familyBoard(all));
  main.appendChild(questsCard());
  main.appendChild(cheerWall());
}
function questsCard() {
  const c = card('FAMILY QUESTS', 'done together');
  familyQuests().forEach(q => c.appendChild(h('div', { class: 'quest' },
    h('div', { class: 'qtop' }, h('span', null, q.icon + ' ' + q.name + ' ', h('small', null, q.val.toLocaleString() + '/' + q.goal.toLocaleString())), h('span', { class: 'rw' }, q.reward)),
    h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.min(100, q.val / q.goal * 100) + '%' })))));
  c.appendChild(h('div', { class: 'dogrow' }, DOGS.map(dg => h('div', { class: 'dog' }, h('b', null, dg.icon + ' ' + dogWalks(dg.id)), dg.name + "'s walks"))));
  return c;
}

// ---------- SETTINGS: everything you set once ----------
function openSettingsFull() {
  const body = h('div', { class: 'log-body' });
  let pick = null; // usual being added
  function sec(title, note) { const x = h('div', { class: 'set-sec' }, h('h3', null, title)); if (note) x.appendChild(h('p', null, note)); body.appendChild(x); return x; }
  function toggle(label, on, fn) { return h('button', { class: 'toggle' + (on ? ' on' : ''), type: 'button', onclick: fn }, label, h('span', { class: 'sw' })); }
  function draw() {
    clear(body); const me = MEM[S.me], P = S.cfg.people[S.me];
    sec('THIS PHONE', 'Set once when the app is installed. Everyone has their own phone; parents can still log for the kids.')
      .appendChild(h('div', { class: 'chips' }, MEMBERS.map(m => h('button', { class: 'chip-btn who' + (m.id === S.me ? ' on' : ''), style: '--house:' + m.house, type: 'button', onclick: () => { S.me = m.id; draw(); render(); } }, (m.pup ? '🐾 ' : '') + m.name))));
    sec('MY COACH', 'Your voice from the Council of Ares. ' + (me.pup ? 'Kids\' coaches only ever talk about moving and having fun.' : ''))
      .appendChild(h('div', { class: 'chips' }, Object.keys(COACHES).map(c => h('button', { class: 'chip-btn' + (P.coach === c ? ' on' : ''), type: 'button', onclick: () => { P.coach = c; delete coachMsg[S.me]; draw(); render(); } }, c))));
    if (!me.pup) {
      const ws = sec('MY WEIGHT GOAL', 'Private. Only the % shows up for the family, and only if you choose.');
      ws.appendChild(h('div', { class: 'edit-row' }, h('span', { class: 'gl' }, 'Season goal'), h('div', { class: 'stepper' },
        h('button', { type: 'button', 'aria-label': 'Less', onclick: () => { P.goalPct = Math.max(1, P.goalPct - 1); draw(); render(); } }, '−'), h('b', null, '−' + P.goalPct + '%'),
        h('button', { type: 'button', 'aria-label': 'More', onclick: () => { P.goalPct = Math.min(20, P.goalPct + 1); draw(); render(); } }, '+'))));
      ws.appendChild(toggle('Share my % lost with the family', P.share, () => { P.share = !P.share; draw(); render(); }));
      const us = sec('MY USUALS', 'One-tap buttons on Today. Up to 4.');
      me.usuals.forEach((u, i) => us.appendChild(h('div', { class: 'edit-row' }, h('span', { class: 'gi' }, ACT[u.act].icon), h('span', { class: 'gl' }, ACT[u.act].name + ' · ' + u.min + ' min' + (u.together ? ' · with the kids' : '')),
        h('button', { class: 'chip-btn', type: 'button', 'aria-label': 'Remove', onclick: () => { me.usuals.splice(i, 1); draw(); render(); } }, '✕'))));
      if (me.usuals.length < 4) {
        if (!pick) us.appendChild(h('button', { class: 'btn-ghost', type: 'button', onclick: () => { pick = { act: 'tread', min: 30 }; draw(); } }, '＋ Add a usual'));
        else {
          us.appendChild(h('div', { class: 'chips', style: 'margin-top:8px' }, ACTIVITIES.map(a => h('button', { class: 'chip-btn' + (pick.act === a.id ? ' on' : ''), type: 'button', onclick: () => { pick.act = a.id; draw(); } }, a.icon))));
          us.appendChild(h('div', { class: 'chips', style: 'margin-top:8px' }, [10, 20, 30, 45, 60].map(n => h('button', { class: 'chip-btn' + (pick.min === n ? ' on' : ''), type: 'button', onclick: () => { pick.min = n; draw(); } }, n + 'm'))));
          us.appendChild(h('button', { class: 'btn-ghost', type: 'button', onclick: () => { me.usuals.push({ act: pick.act, min: pick.min, together: pick.act === 'dogwalk' }); pick = null; draw(); render(); } }, 'Save ' + ACT[pick.act].name + ' ' + pick.min + 'm'));
        }
      }
      const fam = sec('FAMILY SCHEDULE', 'Parents set these once for everyone.');
      fam.appendChild(h('div', { class: 'fld', style: 'margin-top:0' }, 'Taekwondo days'));
      fam.appendChild(h('div', { class: 'chips' }, DOWS.map((d, i) => h('button', { class: 'chip-btn' + (S.cfg.tkdDays.includes(i) ? ' on' : ''), type: 'button', onclick: () => { S.cfg.tkdDays = S.cfg.tkdDays.includes(i) ? S.cfg.tkdDays.filter(x => x !== i) : S.cfg.tkdDays.concat(i).sort(); draw(); render(); } }, d))));
      fam.appendChild(h('div', { class: 'fld' }, 'The dogs'));
      fam.appendChild(h('div', { class: 'two' }, DOGS.map(dg => h('input', { class: 'txt', type: 'text', value: dg.name, 'aria-label': 'Dog name', onchange: e => { dg.name = e.target.value.trim() || dg.name; render(); } }))));
      const fu = sec('FUEL', 'Your food app. The Howlers reads today\'s calories and protein from it on this phone only, never into the family data.');
      const f = readFuel(SEASON.today);
      fu.appendChild(h('div', { class: 'hint', style: 'font-size:14px' }, f ? (f.live ? '✓ Fuel found on this phone.' : 'Demo numbers shown. Install Fuel on this phone to connect it.') : 'Fuel isn\'t set up on this phone.'));
      fu.appendChild(h('a', { class: 'btn-ghost', style: 'display:flex;align-items:center;justify-content:center;text-decoration:none', href: S.cfg.fuelUrl, target: '_blank', rel: 'noopener' }, 'Open Fuel ↗'));
      sec('PELOTON HISTORY', 'Missed a week? Pull everything from Peloton\'s free CSV.').appendChild(h('button', { class: 'btn-ghost', type: 'button', onclick: () => { close(); openImport(render); } }, 'Import Peloton CSV'));
    }
    const ks = sec('CLAUDE KEY', me.pup ? 'Ask a parent to set this up on your phone.' : 'Powers the workout reader and live coaching. Stored only on this phone. Set a monthly spend limit on the key.');
    const inp = h('input', { class: 'txt', type: 'password', placeholder: getKey() ? '•••••• saved' : 'sk-ant-…', autocomplete: 'off' });
    ks.appendChild(h('div', { class: 'ai-row' }, inp, h('button', { class: 'chip-btn', type: 'button', onclick: () => { setKey(inp.value.trim()); toast(inp.value.trim() ? 'Key saved on this phone' : 'Key removed'); draw(); render(); } }, 'Save')));
    sec('REMINDERS', 'On your Pixel, the installed app can send real notifications.').appendChild(
      toggle('Evening nudge if I haven\'t moved today', !!P.nudge, () => { P.nudge = !P.nudge; draw(); }));
  }
  const close = openModal('Settings', body); draw();
}

// ---------- shell ----------
function render() {
  const all = scoreAll(), me = MEM[S.me];
  document.body.classList.toggle('pup', me.pup);
  document.getElementById('season').textContent = NAMES.pack + ' · ' + (me.pup ? NAMES.kids : NAMES.adults);
  document.getElementById('fab').textContent = me.pup ? '🐾 I moved!' : '＋ Log';
  document.getElementById('fab').style.display = TAB === 'today' ? 'none' : '';
  const mem = clear(document.getElementById('members'));
  MEMBERS.forEach(x => mem.appendChild(h('button', { class: 'mchip' + (x.id === S.me ? ' on' : ''), type: 'button', onclick: () => { S.me = x.id; render(); scrollTo(0, 0); } },
    h('span', { class: 'dot', style: 'background:' + x.house }, x.pup ? '🐾' : x.name[0]), x.name + "'s phone")));
  const tb = clear(document.getElementById('tabbar'));
  [['today', '🏠', 'Today'], ['progress', '📈', 'Progress'], ['goals', '🎯', 'Goals'], ['pack', '🐺', 'Pack']].forEach(t => tb.appendChild(h('button', { class: TAB === t[0] ? 'on' : '', type: 'button', onclick: () => { TAB = t[0]; render(); scrollTo(0, 0); } }, h('span', null, t[1]), t[2])));
  const main = clear(document.getElementById('main'));
  if (TAB === 'today') (me.pup ? renderPupToday : renderParentToday)(main, all);
  else if (TAB === 'progress') renderProgress(main, all);
  else if (TAB === 'goals') { main.appendChild(seasonBanner()); renderGoals(main, all); }
  else renderPack(main, all);
  if (TAB === 'today') main.appendChild(seasonBanner());
}
document.getElementById('fab').addEventListener('click', () => openLog(render));
document.getElementById('gear').addEventListener('click', openSettingsFull);
render();
</script>
</body>
</html>
