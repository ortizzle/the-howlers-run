<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ec">
<title>Iron Rain · Gold of Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf6ec; --panel: #fffdf7; --panel2: #f4ecda; --ink: #1e1a14; --ink2: #3c3222; --muted: #7a6a50;
  --line: rgba(153,120,32,.22); --accent: #9a1010; --accent-soft: rgba(154,16,16,.09); --on-accent: #fff;
  --gold: #b08a1e; --green: #3f7a4e; --fh: 'Cormorant SC', Georgia, serif; --fb: 'Spectral', Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 16px; line-height: 1.5; min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.proto-bar { font-family: var(--fb); font-size: 12px; text-align: center; padding: 6px 16px; background: var(--line); color: var(--muted); }
.proto-bar a { color: inherit; }

/* member switcher */
.members { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; scrollbar-width: none; }
.members::-webkit-scrollbar { display: none; }
.mchip { flex: 0 0 auto; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
.mchip .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
.mchip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

/* FAB */
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 40;
  min-height: 56px; padding: 0 28px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  font-family: var(--fh); font-size: 17px; letter-spacing: .06em; box-shadow: 0 8px 28px rgba(0,0,0,.35); display: flex; align-items: center; gap: 10px; }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.modal { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--panel); color: var(--ink);
  border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4 } }
@keyframes fade { from { opacity: 0 } }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.modal-title { font-family: var(--fh); font-size: 19px; }
.modal-x { width: 44px; height: 44px; font-size: 28px; color: var(--muted); }
.fld { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
.fld small { text-transform: none; letter-spacing: 0; opacity: .8; }
.min-val { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 14px; margin-left: 6px; }
.act-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act-group { grid-column: 1 / -1; font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }
.act-btn { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 14px; }
.act-btn.on, .int-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.act-ico { font-size: 18px; }
.min-range { width: 100%; height: 44px; accent-color: var(--accent); }
.int-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.int-btn { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; }
.int-btn small { font-size: 11px; color: var(--muted); }
.lbs-input { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 0 14px; font-size: 17px; }
.log-preview { margin: 18px 0 12px; text-align: center; font-size: 15px; color: var(--muted); }
.log-preview b { font-family: var(--fh); font-size: 34px; color: var(--accent); margin-right: 4px; }
.log-preview-sub { font-size: 12px; }
.btn-primary { width: 100%; min-height: 54px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-family: var(--fh); font-size: 18px; letter-spacing: .06em; }

/* toast */
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -140%); z-index: 200; background: var(--ink); color: var(--bg);
  padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); transition: transform .25s; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
.toast.show { transform: translate(-50%, 0); }

/* shared bits */
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.habit { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 4px; text-align: left; font-size: 15px; }
.habit .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; flex: 0 0 auto; }
.habit.on .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.habit .pts { margin-left: auto; font-size: 12px; color: var(--muted); }
.ledger-row { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ledger-row:first-child { border-top: 0; }
.ledger-row .ld { width: 52px; color: var(--muted); font-size: 12px; flex: 0 0 auto; padding-top: 2px; }
.ledger-row .ll { flex: 1; }
.ledger-row .lp { font-weight: 700; color: var(--accent); }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--ink2); letter-spacing: .04em; }

header { text-align: center; padding: 22px 0 12px; }
.brand { font-family: var(--fh); font-weight: 700; font-size: 30px; letter-spacing: .08em; line-height: 1; }
.brand-sub { font-style: italic; color: var(--muted); font-size: 14px; margin-top: 4px; }
.rule { height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 14px 0; }
.sec { margin-top: 22px; }
.sec-t { font-family: var(--fh); font-weight: 700; font-size: 21px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec-t small { font-family: var(--fb); font-style: italic; font-weight: 400; font-size: 13px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-top: 10px; box-shadow: 0 2px 12px rgba(153,120,32,.1); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.stat { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 4px; }
.stat b { display: block; font-family: var(--fh); font-size: 22px; line-height: 1.1; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.private { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 8px; display: flex; gap: 6px; align-items: center; }
.chart text { font-family: 'Spectral', serif; font-size: 10px; fill: #7a6a50; }
.ladder { display: flex; flex-direction: column-reverse; gap: 3px; }
.rung { display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 30px; }
.rung .lvl { width: 44px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.rung .bx { flex: 1; height: 26px; border-radius: 5px; border: 1px dashed var(--line); display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: var(--muted); }
.rung.done .bx { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
.rung.ms .bx { border-style: solid; border-color: var(--gold); }
.rung.ms.done .bx { background: linear-gradient(90deg, #9a1010, #b08a1e); }
.rung.cap .bx { background: repeating-linear-gradient(45deg, rgba(154,16,16,.12) 0 6px, transparent 6px 12px); border-style: solid; color: var(--accent); }
.hold { display: flex; gap: 14px; align-items: center; }
.hold .seal { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; font-size: 28px; flex: 0 0 auto; background: radial-gradient(circle, #fff8e0, #f0e0b0); }
.hold p { font-size: 14px; }
.hold b { font-family: var(--fh); font-size: 18px; display: block; }
.wk { display: grid; grid-template-columns: 70px 1fr 56px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.wk:first-child { border-top: 0; }
.wk .pts { font-family: var(--fh); font-size: 20px; text-align: right; }
.wk .seg { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--panel2); }
.wk .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badge { text-align: center; padding: 12px 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.badge .ic { font-size: 26px; filter: grayscale(1); opacity: .45; }
.badge.t1 .ic, .badge.t2 .ic, .badge.t3 .ic { filter: none; opacity: 1; }
.badge b { display: block; font-family: var(--fh); font-size: 14px; margin-top: 2px; }
.badge span { font-size: 11px; color: var(--muted); }
.tierpips { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
.tierpips i { width: 8px; height: 8px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); }
.tierpips i.b { background: #a0572a; } .tierpips i.s { background: #a8b0bb; } .tierpips i.g { background: #c9a227; }
.codex td { padding: 7px 4px; border-top: 1px solid var(--line); font-size: 14px; vertical-align: top; }
.codex td:last-child { text-align: right; font-weight: 600; white-space: nowrap; }
.codex tr.h td { font-family: var(--fh); font-weight: 700; font-size: 16px; padding-top: 14px; border-top: 0; color: var(--accent); }
</style>
</head>
<body>
<div class="proto-bar">Prototype B · Gold of Luna · demo data, simulated Dec 18 · <a href="index.html">all prototypes</a></div>
<div class="wrap">
  <header><div class="brand">The Iron Rain</div><div class="brand-sub" id="sub"></div></header>
  <div class="members" id="members"></div>
  <div class="rule"></div>
  <div id="main"></div>
</div>
<button class="fab" id="fab" type="button">✦ Log Trial</button>
<script>
/* ============================================================
   THE IRON RAIN — shared prototype engine (Merit scoring + demo data)
   Prototype only: in-memory state, simulated "today" mid-season.
   ============================================================ */

// ---------- DOM helpers (no innerHTML with data, no inline handlers) ----------
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) appendKids(el, arguments[i]);
  return el;
}
function appendKids(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(x => appendKids(el, x)); return; }
  el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  for (let i = 2; i < arguments.length; i++) appendKids(el, arguments[i]);
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

// ---------- Date helpers (YYYY-MM-DD strings, UTC math = no drift) ----------
function toD(k) { const p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function toK(d) { return d.toISOString().slice(0, 10); }
function addDays(k, n) { const d = toD(k); d.setUTCDate(d.getUTCDate() + n); return toK(d); }
function dow(k) { return (toD(k).getUTCDay() + 6) % 7; } // 0 = Monday
function weekKey(k) { return addDays(k, -dow(k)); }
function daysBetween(a, b) { return Math.round((toD(b) - toD(a)) / 86400000); }
function range(a, b) { const out = []; for (let k = a; k <= b; k = addDays(k, 1)) out.push(k); return out; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function fmtShort(k) { const d = toD(k); return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate(); }
function fmtDow(k) { return DOWS[dow(k)] + ' ' + fmtShort(k); }

// ---------- Season config ----------
const SEASON = { name: 'Season II', start: '2026-12-01', end: '2027-03-21', today: '2026-12-18' };
const HOLIDAY_HOLD = { start: '2026-12-01', end: '2027-01-04', tolerancePct: 0.5, reward: 100 };

const RULES = {
  activeDayMin: 20,   // minutes for a day to count as an Active Day
  activeDay: 10,      // Merit per Active Day
  standardDays: 4,    // Active Days per week to meet the Weekly Standard
  standard: 40,       // Merit for meeting the Standard
  chainStep: 0.10,    // +10% multiplier per consecutive Standard week
  chainMax: 5,        // up to ×1.5
  effortCap: 20,      // daily cap on effort Merit
  weighIn: 5,         // Merit for weighing in (once per week)
  stepPct: 0.5,       // progress credited in 0.5% steps of starting weight
  stepPts: 25,        // Merit per 0.5% step
  weeklyPctCap: 1.0,  // max % credited per week (rewards healthy pace)
  milestones: [[5, 100, 'Five Down'], [10, 150, 'Double Digits'], [15, 200, 'Reforged']],
  habit: 2,           // Merit per daily habit
  habitsMax: 3,
  pr: 25,             // Fitness track: Merit per personal record
  prWeeklyMax: 2,
};
const INTENSITY = { easy: { label: 'Easy', rate: 1 }, steady: { label: 'Steady', rate: 2 }, hard: { label: 'Hard', rate: 3 } };

const ACTIVITIES = [
  { id: 'tread', name: 'Tread', full: 'Peloton Tread', icon: '🏃', group: 'Peloton' },
  { id: 'bike', name: 'Bike', full: 'Peloton Bike', icon: '🚴', group: 'Peloton' },
  { id: 'strength', name: 'Strength', full: 'Peloton Strength', icon: '🏋️', group: 'Peloton' },
  { id: 'yoga', name: 'Yoga', full: 'Yoga / Stretch', icon: '🧘', group: 'Peloton' },
  { id: 'bootcamp', name: 'Bootcamp', full: 'Peloton Bootcamp', icon: '🔥', group: 'Peloton' },
  { id: 'run', name: 'Run', full: 'Outdoor Run', icon: '👟', group: 'Outside' },
  { id: 'walk', name: 'Walk', full: 'Walk', icon: '🚶', group: 'Outside' },
  { id: 'hike', name: 'Hike', full: 'Hike', icon: '⛰️', group: 'Outside' },
  { id: 'ride', name: 'Ride', full: 'Outdoor Ride', icon: '🚵', group: 'Outside' },
  { id: 'swim', name: 'Swim', full: 'Swim', icon: '🏊', group: 'Outside' },
  { id: 'sport', name: 'Sport', full: 'Sport / Pickleball', icon: '🏓', group: 'Outside' },
];
const ACT = {}; ACTIVITIES.forEach(a => ACT[a.id] = a);

const RANKS = [
  { name: 'Red', min: 0, color: '#b3261e' },
  { name: 'Gray', min: 250, color: '#7a7f87' },
  { name: 'Obsidian', min: 600, color: '#2c3e57' },
  { name: 'Copper', min: 1000, color: '#a0572a' },
  { name: 'Silver', min: 1500, color: '#a8b0bb' },
  { name: 'Gold', min: 2100, color: '#c9a227' },
  { name: 'Peerless', min: 2800, color: '#e8c547' },
];
function rankFor(m) { let r = RANKS[0], next = null; for (let i = 0; i < RANKS.length; i++) { if (m >= RANKS[i].min) { r = RANKS[i]; next = RANKS[i + 1] || null; } } return { rank: r, next }; }

// ---------- Members (demo) ----------
const MEMBERS = [
  { id: 'chris', name: 'Chris', title: 'Primus', house: '#9a1010', track: 'weight', share: true, goalPct: 10,
    habits: ['8k steps', 'Protein first', 'No late snacks'], coach: 'Sevro' },
  { id: 'kat', name: 'Kat', title: 'Obsidian', house: '#1e3858', track: 'weight', share: true, goalPct: 8,
    habits: ['Water 80oz', '8k steps', 'Sleep 7h'], coach: 'Mustang' },
  { id: 'sedona', name: 'Sedona', title: 'Violet', house: '#4a1878', track: 'fitness', share: false,
    habits: ['Stretch', 'Water', 'Screens off 9pm'], coach: 'Mustang' },
  { id: 'river', name: 'River', title: 'Copper', house: '#8b4513', track: 'fitness', share: false,
    habits: ['Outside 30m', 'Water', 'Veggies'], coach: 'Ragnar' },
];
const MEM = {}; MEMBERS.forEach(m => MEM[m.id] = m);

// ---------- State ----------
const S = { workouts: [], weighins: [], habits: {}, prs: [], howls: [], me: 'chris' };
let _id = 1; function nid() { return 'x' + (_id++); }

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function seedDemo() {
  const P = {
    chris:  { seed: 11, active: 0.78, min: [30, 60], hard: 0.35, acts: ['tread', 'bike', 'strength', 'walk', 'tread', 'bike'], start: 214.0, rate: 0.21, weigh: 0.85, hab: 0.7 },
    kat:    { seed: 23, active: 0.66, min: [25, 50], hard: 0.25, acts: ['bike', 'yoga', 'strength', 'walk', 'hike', 'bike'], start: 158.0, rate: 0.07, weigh: 0.45, hab: 0.8 },
    sedona: { seed: 37, active: 0.55, min: [20, 45], hard: 0.2, acts: ['yoga', 'bike', 'walk', 'sport', 'tread'], pr: 0.06, hab: 0.6 },
    river:  { seed: 41, active: 0.6, min: [20, 50], hard: 0.4, acts: ['ride', 'run', 'sport', 'bike', 'hike'], pr: 0.08, hab: 0.5 },
  };
  const days = range(SEASON.start, addDays(SEASON.today, -1));
  MEMBERS.forEach(m => {
    const p = P[m.id], r = mulberry32(p.seed);
    S.habits[m.id] = {};
    days.forEach((d, i) => {
      const weekend = dow(d) >= 5;
      if (r() < p.active + (weekend ? 0.08 : 0)) {
        const n = r() < 0.15 ? 2 : 1;
        for (let j = 0; j < n; j++) {
          const act = p.acts[Math.floor(r() * p.acts.length)];
          const min = Math.round((p.min[0] + r() * (p.min[1] - p.min[0])) / 5) * 5;
          const intensity = r() < p.hard ? 'hard' : (r() < 0.6 ? 'steady' : 'easy');
          S.workouts.push({ id: nid(), member: m.id, date: d, act, min, intensity });
        }
      }
      S.habits[m.id][d] = m.habits.map(() => r() < p.hab);
      if (p.start && r() < p.weigh) {
        const lbs = p.start - p.rate * i + (r() - 0.5) * 1.6;
        S.weighins.push({ id: nid(), member: m.id, date: d, lbs: Math.round(lbs * 10) / 10 });
      }
      if (p.pr && r() < p.pr) {
        const labels = { sedona: ['Bike 20-min output PR', 'Longest yoga hold', 'Tread 1-mile PR'], river: ['Fastest mile', 'Longest ride', 'Bike output PR'] }[m.id];
        S.prs.push({ id: nid(), member: m.id, date: d, label: labels[Math.floor(r() * labels.length)] });
      }
    });
    // make sure the start weigh-in exists on day one
    if (p.start && !S.weighins.some(w => w.member === m.id && w.date === SEASON.start))
      S.weighins.push({ id: nid(), member: m.id, date: SEASON.start, lbs: p.start });
  });
  S.howls = [
    { member: 'river', date: '2026-12-17', text: 'Hiked Pinnacle Peak before school. Who else is up before the sun?' },
    { member: 'kat', date: '2026-12-17', text: 'Chain at ×1.2. Do not touch my chain.' },
    { member: 'chris', date: '2026-12-16', text: 'Tread hill climb nearly broke me. Worth it.' },
    { member: 'sedona', date: '2026-12-15', text: 'New bike PR 🚴 — somebody tell River.' },
  ];
}

// ---------- Scoring ----------
function score(mid) {
  const m = MEM[mid], today = SEASON.today;
  const ledger = [];
  const add = (date, cat, label, pts) => { if (pts) ledger.push({ date, cat, label, pts }); };

  // Day info
  const day = {};
  S.workouts.filter(w => w.member === mid && w.date >= SEASON.start && w.date <= today)
    .sort((a, b) => a.date < b.date ? -1 : 1)
    .forEach(w => {
      const d = day[w.date] || (day[w.date] = { min: 0, effort: 0, list: [] });
      d.min += w.min; d.list.push(w);
      const raw = Math.round(w.min / 10 * INTENSITY[w.intensity].rate);
      const pts = Math.max(0, Math.min(raw, RULES.effortCap - d.effort));
      d.effort += pts;
      add(w.date, 'effort', ACT[w.act].full + ' · ' + w.min + ' min ' + INTENSITY[w.intensity].label.toLowerCase(), pts);
    });

  // Weeks, consistency, chain
  const weeks = [];
  let chain = 0;
  for (let wk = weekKey(SEASON.start); wk <= today; wk = addDays(wk, 7)) {
    const wEnd = addDays(wk, 6), complete = wEnd < today;
    const ds = range(wk, wEnd).filter(d => d >= SEASON.start && d <= today);
    let active = 0, stdDate = null, base = 0;
    ds.forEach(d => {
      const di = day[d];
      if (di && di.min >= RULES.activeDayMin) {
        active++; add(d, 'consistency', 'Active Day', RULES.activeDay); base += RULES.activeDay;
        if (active === RULES.standardDays) { stdDate = d; add(d, 'consistency', 'Weekly Standard met', RULES.standard); base += RULES.standard; }
      }
      if (di) base += di.effort;
      const hb = (S.habits[mid] || {})[d];
      if (hb) { const n = Math.min(hb.filter(Boolean).length, RULES.habitsMax); add(d, 'habits', 'Habits ' + n + '/' + m.habits.length, n * RULES.habit); }
    });
    const mult = 1 + RULES.chainStep * chain;
    const bonus = Math.round(base * (mult - 1));
    add(complete ? wEnd : today, 'consistency', 'Chain bonus ×' + mult.toFixed(1) + (complete ? '' : ' (so far)'), bonus);
    weeks.push({ key: wk, end: wEnd, complete, active, standard: !!stdDate, chainIn: chain, mult, days: ds });
    if (complete) chain = stdDate ? Math.min(chain + 1, RULES.chainMax) : Math.max(chain - 1, 0);
  }
  const curWeek = weeks[weeks.length - 1];
  const chainNow = curWeek.chainIn + (curWeek.standard ? 1 : 0) > RULES.chainMax ? RULES.chainMax : curWeek.chainIn;

  // Progress — weight track
  let weight = null;
  if (m.track === 'weight') {
    const ws = S.weighins.filter(w => w.member === mid && w.date >= SEASON.start && w.date <= today).sort((a, b) => a.date < b.date ? -1 : 1);
    if (ws.length) {
      const start = ws[0].lbs; let trend = start, low = start, credited = 0, wkSeen = {}, wkStartCredit = {};
      const series = [];
      ws.forEach(w => {
        trend = trend + 0.3 * (w.lbs - trend);
        low = Math.min(low, trend);
        series.push({ date: w.date, lbs: w.lbs, trend });
        const wk = weekKey(w.date);
        if (!wkSeen[wk]) { wkSeen[wk] = 1; wkStartCredit[wk] = credited; add(w.date, 'progress', 'Weekly weigh-in', RULES.weighIn); }
        const actual = (start - low) / start * 100;
        const allowed = wkStartCredit[wk] + RULES.weeklyPctCap;
        const target = Math.floor(Math.min(actual, allowed) / RULES.stepPct) * RULES.stepPct;
        if (target > credited) {
          const steps = Math.round((target - credited) / RULES.stepPct);
          add(w.date, 'progress', 'New low on trend · ' + target.toFixed(1) + '% down', steps * RULES.stepPts);
          RULES.milestones.forEach(ms => { if (credited < ms[0] && target >= ms[0]) add(w.date, 'progress', 'Milestone: ' + ms[2] + ' (' + ms[0] + '%)', ms[1]); });
          credited = target;
        }
      });
      const pctLost = (start - trend) / start * 100;
      const goalLbs = start * (1 - (m.goalPct || 10) / 100);
      const holdOk = trend <= start * (1 + HOLIDAY_HOLD.tolerancePct / 100);
      const weeksIn = Math.max(1, daysBetween(SEASON.start, today) / 7);
      weight = { start, trend, low, pctLost, credited, series, goalLbs, holdOk, pacePct: pctLost / weeksIn };
    }
  } else {
    // Fitness track — personal records
    const byWk = {};
    S.prs.filter(p => p.member === mid && p.date >= SEASON.start && p.date <= today).sort((a, b) => a.date < b.date ? -1 : 1).forEach(p => {
      const wk = weekKey(p.date); byWk[wk] = (byWk[wk] || 0) + 1;
      if (byWk[wk] <= RULES.prWeeklyMax) add(p.date, 'progress', 'Personal record · ' + p.label, RULES.pr);
    });
  }

  // Aggregates
  const cats = { consistency: 0, effort: 0, progress: 0, habits: 0 };
  let total = 0; const byDate = {}, byWeek = {};
  ledger.forEach(e => { cats[e.cat] += e.pts; total += e.pts; byDate[e.date] = (byDate[e.date] || 0) + e.pts; const wk = weekKey(e.date); byWeek[wk] = (byWeek[wk] || 0) + e.pts; });
  ledger.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const activeDays = Object.keys(day).filter(d => day[d].min >= RULES.activeDayMin);
  const totalMin = Object.keys(day).reduce((a, d) => a + day[d].min, 0);
  const prs = S.prs.filter(p => p.member === mid && p.date <= today).length;
  return { m, total, cats, ledger, day, weeks, curWeek, chain: curWeek.chainIn, chainNow, weight, byDate, byWeek, activeDays, totalMin, prs, rank: rankFor(total) };
}

        h('div', { class: 'stat' }, h('b', null, w.trend.toFixed(1)), h('span', null, 'TREND')),
        h('div', { class: 'stat' }, h('b', { style: 'color:var(--accent)' }, '−' + w.pctLost.toFixed(1) + '%'), h('span', null, 'LOST')),
        h('div', { class: 'stat' }, h('b', null, w.pacePct.toFixed(2) + '%'), h('span', null, 'PER WEEK'))),
      h('div', { class: 'panel' }, weightChart(w, m),
        h('div', { class: 'private' }, '🔒 Pounds are visible only to you. The pack sees ' + (m.share ? '% lost.' : 'nothing — sharing is off.'))),
      h('div', { class: 'private' }, h('span', { style: 'display:inline-block;width:14px;height:10px;background:rgba(63,122,78,.25);border-radius:2px' }), 'Green band = healthy pace (0.5–1% per week)')));

    main.appendChild(h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, 'Milestone Ladder', h('small', null, w.credited.toFixed(1) + '% credited')), h('div', { class: 'panel' }, ladder(w))));

    main.appendChild(h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, 'The Holiday Hold'),
      h('div', { class: 'panel hold' }, h('div', { class: 'seal' }, w.holdOk ? '🛡️' : '⚠️'),
        h('p', null, h('b', null, w.holdOk ? 'Holding the line' : 'Above the line'),
          'Finish Jan 4 with your trend no more than 0.5% above Dec 1 → +' + HOLIDAY_HOLD.reward + ' Merit. Maintaining through the holidays counts as winning. ',
          h('i', null, daysBetween(SEASON.today, HOLIDAY_HOLD.end) + ' days left.')))));
  } else {
    main.appendChild(h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, 'The Ascent', h('small', null, 'fitness track')),
      h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('b', null, sc.totalMin), h('span', null, 'MINUTES')),
        h('div', { class: 'stat' }, h('b', null, sc.activeDays.length), h('span', null, 'ACTIVE DAYS')),
        h('div', { class: 'stat' }, h('b', { style: 'color:var(--accent)' }, sc.prs), h('span', null, 'RECORDS')),
        h('div', { class: 'stat' }, h('b', null, '×' + sc.curWeek.mult.toFixed(1)), h('span', null, 'CHAIN'))),
      h('div', { class: 'panel' }, minutesChart(sc),
        h('div', { class: 'private' }, '⚡ Fitness track: progress Merit comes from personal records (Peloton output, fastest mile, longest ride) — no scale involved.'))));
    const prs = S.prs.filter(p => p.member === m.id && p.date <= SEASON.today);
    main.appendChild(h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, 'Records Broken'),
      h('div', { class: 'panel' }, prs.length ? prs.map(p => h('div', { class: 'ledger-row' }, h('span', { class: 'ld' }, fmtShort(p.date)), h('span', { class: 'll' }, p.label), h('span', { class: 'lp' }, '+' + RULES.pr))) : h('i', null, 'No records yet this season.'))));
  }

  // Weekly scorecards
  const wkPanel = h('div', { class: 'panel' });
  sc.weeks.slice().reverse().forEach(w => {
    const parts = { consistency: 0, effort: 0, progress: 0, habits: 0 };
    sc.ledger.filter(e => weekKey(e.date) === w.key).forEach(e => parts[e.cat] += e.pts);
    const seg = h('div', { class: 'seg' }); Object.keys(parts).forEach(k => seg.appendChild(h('i', { style: 'flex:' + (parts[k] || 0.001) + ';background:' + CAT_COLORS[k] })));
    wkPanel.appendChild(h('div', { class: 'wk' }, h('div', null, h('b', null, fmtShort(w.key)), h('div', { class: 'meta' }, w.complete ? 'final' : 'in progress')),
      h('div', null, seg, h('div', { class: 'meta' }, w.active + ' Active Days · ' + (w.standard ? '✦ Standard' : 'no Standard') + ' · ×' + w.mult.toFixed(1))),
      h('div', { class: 'pts' }, sc.byWeek[w.key] || 0)));
  });
  main.appendChild(h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, 'Weekly Scorecards', h('small', null, 'Total ' + sc.total + ' · ' + sc.rank.rank.name)), wkPanel,
    h('div', { class: 'private' }, ['consistency', 'effort', 'progress', 'habits'].map(k => h('span', null, h('span', { style: 'display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:' + CAT_COLORS[k] }), k[0].toUpperCase() + k.slice(1) + ' ')))));

  // Badges
  const bg = h('div', { class: 'badges' });
  badges(sc).forEach(b => {
    const pips = h('div', { class: 'tierpips' }); ['b', 's', 'g'].forEach((c, i) => pips.appendChild(h('i', { class: i < b.tier ? c : '' })));
    bg.appendChild(h('div', { class: 'badge t' + b.tier }, h('div', { class: 'ic' }, b.icon), h('b', null, b.name), h('span', null, b.v + (b.next ? ' / ' + b.next : ' ✓')), pips));
  });
  main.appendChild(h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, 'Honors'), h('div', { style: 'margin-top:10px' }, bg)));

  main.appendChild(h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, 'The Merit Codex'), h('div', { class: 'panel' }, codex())));
}
document.getElementById('fab').addEventListener('click', () => openLog(render));
render();
</script>
